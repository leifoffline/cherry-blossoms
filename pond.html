<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koi Pond · Low Poly</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 18px; text-align: center;
    font: bold 13px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
    letter-spacing: 0.12em; color: #fff; text-shadow: 1px 1px 0 #1a3a8a;
    pointer-events: none; transition: opacity 2s;
  }
  #hint.error { background: #b3261e; text-shadow: none; padding: 6px 0; }
  .bar { position: fixed; top: 14px; right: 14px; display: flex; gap: 8px; }
  .bar button {

    font: bold 12px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: 0.1em;

    opacity: 0.7; cursor: pointer;
  }
  .bar button:hover, .bar button:focus-visible { opacity: 1; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="bar"><button id="crt" type="button" aria-pressed="true">CRT: on</button></div>
<div id="hint">drag to orbit · right-drag to pan · scroll to zoom<br>C CRT · R reset view</div>
<script type="module">
// Koi pond: the ASCII pond from the ascii_pond project, remade in the low-poly
// renderer. So far: the water and its pebbled floor, five koi (models/koi.js)
// wandering under the surface, and the foliage: lily pads, two stands of reeds and
// cattails, grass round the banks, and the cherry tree (models/cherry-tree.js)
// leaning in where the blossom branch was. Still to come, one at a time: ducks and
// ducklings, floating petals, dragonflies, fireflies, the heron and swan, feeding,
// ripples, time of day, rain.
//
// URL options: ?crt=off, ?seed=12.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------------------------------------------------------------- settings
const MODEL_FILES = ['koi', 'cherry-tree'];
const params = new URLSearchParams(location.search);
const SEED = Number(params.get('seed')) || 3;
const RENDER_HEIGHT = 300;      // internal resolution in pixels; lower = chunkier
const SUN_DIR = new THREE.Vector3(-0.45, 0.42, -0.8).normalize();
const WIND_DIR = new THREE.Vector3(1, 0, 0.35).normalize();
const TAU = Math.PI * 2;

const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOTION = reducedMotion ? 0.35 : 1;
const remember = (key, value) => { try { localStorage.setItem(key, value); } catch {} };
const recall = (key) => { try { return localStorage.getItem(key); } catch { return null; } };

// ------------------------------------------------------------- seeded RNG
function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(SEED);                 // for the pond itself; each model gets its own stream
const rr = (a, b) => a + (b - a) * rand();
const pick = (list) => list[(rand() * list.length) | 0];

// ------------------------------------------------------------ scene setup
const renderer = new THREE.WebGLRenderer({ antialias: false });
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.5, 1200);

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8b8c4, 2.6));
const sun = new THREE.DirectionalLight(0xfff6e0, 2.0);
sun.position.copy(SUN_DIR).multiplyScalar(50);
scene.add(sun);

// --------------------------------------------------------- pixel textures
function canvasTexture(w, h, paint, { pixelated = true, mipmaps = false } = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  paint(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.magFilter = pixelated ? THREE.NearestFilter : THREE.LinearFilter;
  t.minFilter = mipmaps ? THREE.LinearMipmapLinearFilter : (pixelated ? THREE.NearestFilter : THREE.LinearFilter);
  t.generateMipmaps = mipmaps;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

// grass: soft light and dark patches with short blade strokes on top; wraps seamlessly
const GRASS_SIZE = 64;
const grassTex = canvasTexture(GRASS_SIZE, GRASS_SIZE, (ctx, w, h) => {
  const G = 8, grid = Array.from({ length: G * G }, () => rand());
  const patch = (x, y) => {                    // smooth noise that repeats every w pixels
    const fx = (x / w) * G, fy = (y / h) * G, x0 = Math.floor(fx), y0 = Math.floor(fy);
    const u = fx - x0, v = fy - y0, at = (i, j) => grid[((j + G) % G) * G + ((i + G) % G)];
    const L = THREE.MathUtils.lerp;
    return L(L(at(x0, y0), at(x0 + 1, y0), u), L(at(x0, y0 + 1), at(x0 + 1, y0 + 1), u), v);
  };
  const greens = ['#2c8f22', '#3aa628', '#4dbb2e', '#62cc36', '#7cdc40'];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const n = patch(x, y) + rr(-0.16, 0.16);
    ctx.fillStyle = greens[THREE.MathUtils.clamp(Math.floor(n * greens.length), 0, greens.length - 1)];
    ctx.fillRect(x, y, 1, 1);
  }
  const blades = ['#9be84c', '#b4f060', '#84de42', '#247c1c', '#1f6e1a'];
  for (let i = 0; i < 520; i++) {
    let x = (rand() * w) | 0, y = (rand() * h) | 0;
    const len = 2 + ((rand() * 4) | 0), lean = rand() < 0.5 ? -1 : 1;
    ctx.fillStyle = pick(blades);
    for (let k = 0; k < len; k++) {
      ctx.fillRect(((x % w) + w) % w, ((y % h) + h) % h, 1, 1);
      y -= 1; if (k % 2 === 1) x += lean;
    }
  }
}, { mipmaps: true });

// sky: blue gradient with wispy clouds, painted once from layered noise
function hash3(x, y, z) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 2147483647) ^ (SEED * 9781);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const s = (t) => t * t * (3 - 2 * t);
  const u = s(x - xi), v = s(y - yi), w = s(z - zi);
  const L = THREE.MathUtils.lerp;
  const at = (a, b, c) => hash3(xi + a, yi + b, zi + c);
  return L(
    L(L(at(0, 0, 0), at(1, 0, 0), u), L(at(0, 1, 0), at(1, 1, 0), u), v),
    L(L(at(0, 0, 1), at(1, 0, 1), u), L(at(0, 1, 1), at(1, 1, 1), u), v), w);
}
const skyTex = canvasTexture(512, 256, (ctx, w, h) => {
  const img = ctx.createImageData(w, h);
  const top = [10, 62, 214], low = [96, 170, 255];
  for (let y = 0; y < h; y++) {
    const up = Math.max(0, 1 - y / (h / 2));           // 1 at the zenith, 0 at the horizon and below
    for (let x = 0; x < w; x++) {
      const a = (x / w) * Math.PI * 2;                 // sampled around a circle so the seam matches
      let n = 0, amp = 0.5, f = 1;
      for (let o = 0; o < 5; o++) {
        n += amp * noise3(Math.cos(a) * 2.2 * f, Math.sin(a) * 2.2 * f, (y / h) * 9 * f + o * 7.3);
        amp *= 0.5; f *= 2;
      }
      const cloud = THREE.MathUtils.smoothstep(n, 0.4, 0.62) * THREE.MathUtils.smoothstep(up, 0.02, 0.3);
      const g = Math.pow(up, 0.7);
      const i = (y * w + x) * 4;
      for (let k = 0; k < 3; k++) img.data[i + k] = THREE.MathUtils.lerp(THREE.MathUtils.lerp(low[k], top[k], g), 255, cloud);
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}, { pixelated: false });
skyTex.wrapT = THREE.ClampToEdgeWrapping;

// ------------------------------------------------ PS1-style vertex shader
// Every material gets vertex snapping (the wobble of old consoles). Plants also get
// wind. How far a point bends depends on its height and, for the tree, on how far
// out it is from the trunk; `flex` is [height where bending starts, height where it
// is full, extra bend per unit out from the root]. The root is wherever
// `windRoot` was pointing when the material was made.
const shared = { uTime: { value: 0 }, uSnap: { value: new THREE.Vector2(160, 120) } };
const windRoot = new THREE.Vector3();
const TREE_FLEX = [2.2, 9, 0.03];
const PSX_GLSL = /* glsl */`
  uniform float uTime;
  uniform float uWind;
  uniform vec2 uSnap;
  uniform vec3 uWindRoot;
  uniform vec3 uFlex;
  vec3 windOffset(vec3 p) {
    float flex = smoothstep(uFlex.x, uFlex.y, p.y) * 0.75 + uFlex.z * length(p.xz - uWindRoot.xz);
    float gust = 0.3
      + 0.6 * sin(uTime * 0.9 + p.x * 0.35 + p.z * 0.25)
      + 0.25 * sin(uTime * 2.3 + p.x * 1.3 + p.y * 0.9);
    vec3 dir = normalize(vec3(1.0, 0.0, 0.35));
    vec3 o = dir * flex * gust * 0.3;
    o.y += sin(uTime * 3.1 + p.x * 2.0 + p.z * 2.0) * 0.03 * flex;
    return o * uWind;
  }
`;
const PSX_PROJECT_GLSL = /* glsl */`
  vec4 wPos = vec4(transformed, 1.0);
  #ifdef USE_INSTANCING
    wPos = instanceMatrix * wPos;
  #endif
  wPos = modelMatrix * wPos;
  wPos.xyz += windOffset(wPos.xyz);
  vec4 mvPosition = viewMatrix * wPos;
  gl_Position = projectionMatrix * mvPosition;
  gl_Position.xy = floor(gl_Position.xy / gl_Position.w * uSnap + 0.5) / uSnap * gl_Position.w;
`;
function psx(material, windAmount = 0, flex = TREE_FLEX) {
  const uniforms = {
    uWind: { value: windAmount * MOTION },
    uWindRoot: { value: windRoot.clone() },
    uFlex: { value: new THREE.Vector3(...flex) },
  };
  material.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = shared.uTime;
    shader.uniforms.uSnap = shared.uSnap;
    Object.assign(shader.uniforms, uniforms);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\n' + PSX_GLSL)
      .replace('#include <project_vertex>', PSX_PROJECT_GLSL);
  };
  material.customProgramCacheKey = () => 'psx';
  return material;
}

// --------------------------------------------------------------------- sky
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(900, 24, 12),
  new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, depthWrite: false, fog: false })
);
sky.renderOrder = -1;
scene.add(sky);

// ------------------------------------------------------------- pond shape
// The pond is a lopsided oval. `rim(a, k)` is the point at angle `a` round it, `k`
// of the way out from the middle (1 = the water's edge), as (x, z).
const POND_X = 13, POND_Z = 8.6, DEPTH = 2.3, SEG = 72;
function rim(a, k = 1) {
  const wobble = 1 + 0.07 * Math.sin(3 * a + 0.6) + 0.05 * Math.sin(5 * a + 2.1);
  return new THREE.Vector2(Math.cos(a) * POND_X * wobble * k, Math.sin(a) * POND_Z * wobble * k);
}
const ringOf = (k, y) => Array.from({ length: SEG }, (_, i) => {
  const p = rim((i / SEG) * TAU, k);
  return new THREE.Vector3(p.x, y, p.y);
});
function geometryOf(pos, uv, index) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(pos.map((_, i) => (i % 3 === 1 ? 1 : 0)), 3));
  g.setIndex(index);
  return g;
}
// a flat sheet filling a ring of points, textured by position (`tile` world units a repeat)
function sheet(ring, tile) {
  const pos = [0, ring[0].y, 0], uv = [0, 0], index = [];
  ring.forEach((p, i) => {
    pos.push(p.x, p.y, p.z); uv.push(p.x / tile, p.z / tile);
    index.push(0, 1 + ((i + 1) % ring.length), 1 + i);
  });
  return geometryOf(pos, uv, index);
}
// a strip joining two rings; textured by position, or wrapped `wrap` times round if given
function band(inner, outer, tile, wrap) {
  const pos = [], uv = [], index = [], n = inner.length;
  for (let i = 0; i <= n; i++) {
    const a = inner[i % n], b = outer[i % n];
    pos.push(a.x, a.y, a.z, b.x, b.y, b.z);
    if (wrap) uv.push((i / n) * wrap, 1, (i / n) * wrap, 0);
    else uv.push(a.x / tile, a.z / tile, b.x / tile, b.z / tile);
    if (i < n) index.push(i * 2, i * 2 + 2, i * 2 + 1, i * 2 + 2, i * 2 + 3, i * 2 + 1);
  }
  return geometryOf(pos, uv, index);
}

// ---------------------------------------------------------- ground and bed
// grass everywhere but the pond
const TEXEL = 0.1;                             // world size of one grass pixel
{
  const far = Array.from({ length: SEG }, (_, i) => {
    const a = (i / SEG) * TAU;
    return new THREE.Vector3(Math.cos(a) * 600, 0, Math.sin(a) * 600);
  });
  scene.add(new THREE.Mesh(band(ringOf(1, 0), far, GRASS_SIZE * TEXEL), psx(new THREE.MeshLambertMaterial({ map: grassTex }))));
}

// the bed: pebbles on a blue-green floor, already tinted as if seen through water
const pebbleTex = canvasTexture(64, 64, (ctx, w, h) => {
  const floor = ['#2a6a88', '#2f7392', '#286482', '#337a98'];
  for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) { ctx.fillStyle = pick(floor); ctx.fillRect(x, y, 2, 2); }
  const stones = ['#5f9ab0', '#7fb4c2', '#4f8aa4', '#9cc6cc', '#6aa6b6'];
  for (let i = 0; i < 30; i++) {
    const cx = rr(0, w), cy = rr(0, h), rx = rr(1.6, 4.6), ry = rx * rr(0.6, 1), light = pick(stones), dark = '#22566f';
    for (let y = -6; y <= 6; y++) for (let x = -6; x <= 6; x++) {
      const d = (x / rx) ** 2 + (y / ry) ** 2;
      if (d > 1) continue;
      ctx.fillStyle = d > 0.6 && x + y > 0 ? dark : light;       // a shaded lower-right edge
      ctx.fillRect((((cx + x) | 0) + w) % w, (((cy + y) | 0) + h) % h, 1, 1);
    }
  }
}, { mipmaps: true });
const bankTex = canvasTexture(16, 16, (ctx) => {
  const earth = ['#4c6a62', '#3f5c58', '#58766a', '#365250'];
  for (let y = 0; y < 16; y += 2) for (let x = 0; x < 16; x += 2) { ctx.fillStyle = pick(earth); ctx.fillRect(x, y, 2, 2); }
  ctx.fillStyle = '#6f9a5c';                    // moss along the top
  for (let x = 0; x < 16; x++) ctx.fillRect(x, 0, 1, 1 + ((rand() * 3) | 0));
});
scene.add(new THREE.Mesh(sheet(ringOf(0.9, -DEPTH), 6), psx(new THREE.MeshBasicMaterial({ map: pebbleTex }))));
scene.add(new THREE.Mesh(band(ringOf(0.9, -DEPTH), ringOf(1, 0), 0, 26), psx(new THREE.MeshBasicMaterial({ map: bankTex, side: THREE.DoubleSide }))));

// ------------------------------------------------------------------- water
// Two sheets of blue, one at the surface and one halfway down, so things look
// bluer the deeper they are; and on the surface two layers of bright ripple lines
// sliding across each other.
const rippleTex = canvasTexture(64, 64, (ctx, w, h) => {
  ctx.fillStyle = '#fff';
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const u = (x / w) * TAU, v = (y / h) * TAU;
    const a = Math.abs(Math.sin(u * 2 + 1.5 * Math.sin(v) + 0.8 * Math.sin(v * 3)));
    const b = Math.abs(Math.sin(v * 3 + 1.4 * Math.sin(u * 2) + 0.6 * Math.sin(u)));
    if (a < 0.1 || b < 0.08) ctx.fillRect(x, y, 1, 1);
  }
});
const rippleTex2 = rippleTex.clone();
rippleTex2.needsUpdate = true;
const waterLayers = [
  { y: -1.45, material: new THREE.MeshBasicMaterial({ color: 0x1f6f9c, transparent: true, opacity: 0.34, depthWrite: false }) },
  { y: -0.1, material: new THREE.MeshBasicMaterial({ color: 0x3a8fc0, transparent: true, opacity: 0.4, depthWrite: false }) },
  { y: -0.09, tile: 8, material: new THREE.MeshBasicMaterial({ map: rippleTex, transparent: true, opacity: 0.13, blending: THREE.AdditiveBlending, depthWrite: false }) },
  { y: -0.08, tile: 13, material: new THREE.MeshBasicMaterial({ map: rippleTex2, transparent: true, opacity: 0.09, blending: THREE.AdditiveBlending, depthWrite: false }) },
];
waterLayers.forEach(({ y, tile = 1, material }, i) => {
  const mesh = new THREE.Mesh(sheet(ringOf(y < -1 ? 0.95 : 0.998, y), tile), psx(material));
  mesh.renderOrder = 1 + i;
  scene.add(mesh);
});

// ------------------------------------------------------------------ models
// the same model files the viewer shows (see viewer.html); here they are built
// several times over and placed around the pond
const registry = new Map();
window.THREE = THREE;
window.registerModel = (def) => registry.set(def.name, def);

const hint = document.getElementById('hint');
function fail(message, error) {
  if (error) console.error(error);
  hint.textContent = message;
  hint.className = 'error';
  hint.style.opacity = 1;
}
const loadScript = (src) => new Promise((resolve) => {
  const s = document.createElement('script');
  s.src = src;
  s.onload = resolve;
  s.onerror = () => { fail(`could not load ${src}`); resolve(); };
  document.head.appendChild(s);
});
for (const file of MODEL_FILES) await loadScript(`models/${file}.js`);

// builds a model standing at `at`; its plants sway about that spot
function build(name, at, seed = SEED) {
  windRoot.copy(at);
  try {
    const built = registry.get(name).build({
      THREE, psx, canvasTexture, mergeGeometries,
      rand: mulberry32(seed), seed, sunDir: SUN_DIR, windDir: WIND_DIR,
    });
    const model = built.isObject3D ? { object: built } : built;
    const holder = new THREE.Group();
    holder.position.copy(at);
    holder.add(model.object);
    scene.add(holder);
    return { ...model, holder };
  } catch (error) {
    fail(`${name} failed to build: ${error?.message ?? 'not loaded'}`, error);
    return null;
  } finally {
    windRoot.set(0, 0, 0);
  }
}

// --------------------------------------------------------------------- koi
// Five koi, as in the ASCII pond: each swims toward a spot picked somewhere in the
// pond, turning gradually, then picks another. They keep to their own depths.
const KOI_SCALE = 0.55, KOI_HOVER = 1.7;       // the model floats this far above its own origin
const koi = [['kohaku', 1.15], ['ogon', 0.95], ['sanke', 0.85], ['shusui', 1.0], ['showa', 0.72]].map(([variety, size], i) => {
  const model = build('koi', new THREE.Vector3(), SEED + i);
  if (!model) return null;
  model.setVariant(variety);
  const scale = KOI_SCALE * size, start = rim(rr(0, TAU), rr(0.15, 0.7));
  model.holder.scale.setScalar(scale);
  return {
    model, holder: model.holder,
    x: start.x, z: start.y, y: -0.55 - 0.16 * i - KOI_HOVER * scale,
    heading: rr(0, TAU), speed: 0, cruise: rr(0.9, 1.4), goal: null, patience: 0, clock: rr(0, 20),
  };
}).filter(Boolean);

function updateKoi(dt) {
  for (const k of koi) {
    k.patience -= dt;
    if (!k.goal || k.patience <= 0 || Math.hypot(k.goal.x - k.x, k.goal.y - k.z) < 2) {
      k.goal = rim(Math.random() * TAU, 0.1 + 0.62 * Math.random());
      k.patience = 12 + Math.random() * 14;
      k.cruise = 0.8 + Math.random() * 0.7;
    }
    const want = Math.atan2(k.goal.y - k.z, k.goal.x - k.x);
    const turn = Math.atan2(Math.sin(want - k.heading), Math.cos(want - k.heading));
    k.heading += THREE.MathUtils.clamp(turn, -0.7 * dt, 0.7 * dt);
    k.speed += (k.cruise * (1 - 0.45 * Math.min(1, Math.abs(turn))) - k.speed) * Math.min(1, dt * 1.5);   // slower through a turn
    k.x += Math.cos(k.heading) * k.speed * dt;
    k.z += Math.sin(k.heading) * k.speed * dt;
    k.holder.position.set(k.x, k.y, k.z);
    k.holder.rotation.y = Math.PI - k.heading;   // the model faces -x
    const swim = dt * (0.5 + 0.5 * k.speed);     // the tail beats with the speed
    k.clock += swim;
    k.model.update(swim, k.clock);
  }
}

// --------------------------------------------------------------- lily pads
// round leaves with a notch, lying on the water; no flowers
const padTex = canvasTexture(16, 16, (ctx) => {
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const dx = x - 7.5, dy = y - 7.5, r = Math.hypot(dx, dy) / 8, spoke = ((Math.atan2(dy, dx) / TAU + 1) * 9) % 1;
    ctx.fillStyle = r > 0.86 ? '#6fae72' : spoke < 0.16 && r > 0.12 ? '#c4e6b0' : rand() < 0.18 ? '#8cc88a' : '#9ad493';
    ctx.fillRect(x, y, 1, 1);
  }
});
const padGeometry = new THREE.CircleGeometry(1, 11, 0.25, TAU - 0.5).rotateX(-Math.PI / 2);
const padMaterials = [0xffffff, 0xe4f2dc, 0xd2eccc].map((color) => psx(new THREE.MeshBasicMaterial({ map: padTex, color })));
const pads = [];
for (let tries = 0; pads.length < 22 && tries < 2000; tries++) {
  const p = rim(rr(0, TAU), 0.3 + 0.6 * rand() ** 0.6), r = rr(0.6, 1.05);
  if (pads.some((o) => Math.hypot(o.x - p.x, o.z - p.y) < o.r + r + 0.25)) continue;
  const mesh = new THREE.Mesh(padGeometry, pick(padMaterials));
  mesh.scale.setScalar(r);
  mesh.rotation.y = rr(0, TAU);
  scene.add(mesh);
  pads.push({ mesh, x: p.x, z: p.y, r, phase: rr(0, TAU), turn: mesh.rotation.y });
}
function updatePads(time) {                    // each drifts a little about its place and rocks on the water
  for (const p of pads) {
    p.mesh.position.set(p.x + 0.12 * Math.sin(time * 0.23 + p.phase), 0.015 + 0.012 * Math.sin(time * 0.9 + p.phase), p.z + 0.12 * Math.cos(time * 0.19 + p.phase * 1.7));
    p.mesh.rotation.y = p.turn + 0.12 * Math.sin(time * 0.15 + p.phase);
  }
}

// ------------------------------------------------------- reeds and cattails
// two short stands at the water's edge, in opposite corners
const colourBy = (geometry, colourAt) => {     // paints each point by its height
  const p = geometry.attributes.position, c = new Float32Array(p.count * 3), col = new THREE.Color();
  for (let i = 0; i < p.count; i++) { col.set(colourAt(p.getY(i))); c.set([col.r, col.g, col.b], i * 3); }
  geometry.setAttribute('color', new THREE.BufferAttribute(c, 3));
  return geometry;
};
const SHORE = -0.4;                            // plants root a little under the surface
function reedStand(angle, count) {
  const parts = [], low = new THREE.Color('#5a9060'), high = new THREE.Color('#bfe0a4');
  for (let i = 0; i < count; i++) {
    const at = rim(angle + rr(-0.22, 0.22), rr(0.82, 1.0)), h = rr(1.3, 2.6);
    const lean = rr(-0.3, 0.3), bow = rr(-0.25, 0.25);
    const blade = new THREE.PlaneGeometry(0.3, h, 1, 4).translate(0, h / 2, 0), p = blade.attributes.position;
    for (let k = 0; k < p.count; k++) {        // taper to a point, and bend over
      const f = p.getY(k) / h;
      p.setXYZ(k, p.getX(k) * (1 - 0.9 * f) + lean * f * f * h * 0.4, p.getY(k), bow * f * f * h * 0.4);
    }
    colourBy(blade, (y) => low.clone().lerp(high, y / h));
    parts.push(blade.rotateY(rr(0, TAU)).translate(at.x, SHORE, at.y));
    if (i % 3 === 0 && h > 1.7) {              // a cattail: a stalk with a brown head and a spike
      const stalk = colourBy(new THREE.CylinderGeometry(0.02, 0.03, h + 0.3, 4).translate(0, (h + 0.3) / 2, 0), () => '#7fae72');
      const top = colourBy(new THREE.CylinderGeometry(0.085, 0.085, 0.5, 6).translate(0, h + 0.2, 0), () => '#9a6a48');
      const spike = colourBy(new THREE.CylinderGeometry(0.008, 0.02, 0.3, 4).translate(0, h + 0.6, 0), () => '#c8b888');
      const x = at.x + rr(-0.25, 0.25), z = at.y + rr(-0.25, 0.25);
      for (const g of [stalk, top, spike]) parts.push(g.translate(x, SHORE, z));
    }
  }
  const geometry = mergeGeometries(parts);
  parts.forEach((g) => g.dispose());
  scene.add(new THREE.Mesh(geometry, psx(new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }), 1, [0.1, 2.8, 0])));
}
reedStand(2.5, 22);                            // near left
reedStand(-0.62, 18);                          // far right

// -------------------------------------------------------------- bank grass
// tufts all round the rim, thick in the four corners; each is two crossed cards
const tuftTex = canvasTexture(16, 16, (ctx) => {
  const blades = ['#9be84c', '#b4f060', '#84de42', '#5cbc34', '#c8f47c'];
  for (let i = 0; i < 16; i++) {
    let x = 1 + ((rand() * 14) | 0);
    const top = (rand() * 9) | 0, lean = rand() < 0.5 ? -1 : 1;
    ctx.fillStyle = pick(blades);
    for (let y = 15; y >= top; y--) {
      ctx.fillRect(Math.min(15, Math.max(0, x)), y, y > 9 ? 2 : 1, 1);
      if ((15 - y) % 4 === 3) x += lean;
    }
  }
});
tuftTex.wrapS = tuftTex.wrapT = THREE.ClampToEdgeWrapping;
{
  const spots = [];
  for (let i = 0; i < 170; i++) spots.push([rr(0, TAU), 1.03 + 0.28 * rand() ** 2, rr(0.45, 0.85)]);
  for (const corner of [0.72, 2.45, 3.85, 5.6]) {
    for (let i = 0; i < 55; i++) spots.push([corner + rr(-0.36, 0.36), 1.03 + 0.5 * rand(), rr(0.7, 1.35)]);
  }
  const card = new THREE.PlaneGeometry(1, 1).translate(0, 0.5, 0);
  const tufts = new THREE.InstancedMesh(
    mergeGeometries([card, card.clone().rotateY(Math.PI / 2)]),
    psx(new THREE.MeshBasicMaterial({ map: tuftTex, alphaTest: 0.5, side: THREE.DoubleSide }), 0.7, [0, 1.3, 0]),
    spots.length);
  const dummy = new THREE.Object3D(), tint = new THREE.Color();
  spots.forEach(([a, k, size], i) => {
    const at = rim(a, k);
    dummy.position.set(at.x, 0, at.y);
    dummy.rotation.y = rr(0, TAU);
    dummy.scale.set(size * 1.15, size, size * 1.15);
    dummy.updateMatrix();
    tufts.setMatrixAt(i, dummy.matrix);
    tufts.setColorAt(i, tint.set(pick([0xffffff, 0xe2f8d0, 0xcdeebc, 0xf4ffd8])));
  });
  tufts.frustumCulled = false;
  scene.add(tufts);
}

// ------------------------------------------------------------- cherry tree
// stands on the far left bank, its boughs out over the water, where the ASCII
// pond had a blossoming branch reaching in; its petals fall onto the surface
const TREE_AT = rim(3.85, 1.2);
const tree = build('cherry-tree', new THREE.Vector3(TREE_AT.x, 0, TREE_AT.y));

// ------------------------------------------------------ camera + controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minPolarAngle = 0.05;
controls.maxPolarAngle = 1.45;                 // never down to the water
controls.minDistance = 5;
controls.maxDistance = 90;
function resetView() {                         // from the near bank, looking down, far enough back to see it all
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = Math.max(11 / tanV, 16 / (tanV * camera.aspect));
  controls.target.set(0, 0, 0.5);
  camera.position.set(0, dist * Math.sin(0.9), 0.5 + dist * Math.cos(0.9));
  controls.update();
}

// ------------------------------------------------- low-res target + screen
// The scene is drawn into a small image, then one full-window pass puts it on
// screen: either as plain hard pixels, or through the CRT filter.
const sceneRT = new THREE.WebGLRenderTarget(1, 1, {
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
});
const screenMaterial = new THREE.ShaderMaterial({
  uniforms: {
    tScene: { value: sceneRT.texture },
    uRes: { value: new THREE.Vector2(1, 1) },   // size of the small image
    uCrt: { value: 1 },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D tScene;
    uniform vec2 uRes;
    uniform float uCrt;
    varying vec2 vUv;

    // bulge the picture like curved glass
    vec2 curve(vec2 uv) {
      uv = uv * 2.0 - 1.0;
      vec2 off = abs(uv.yx) / vec2(5.5, 4.5);
      uv += uv * off * off;
      uv /= 1.0 + 1.0 / (vec2(5.5, 4.5) * vec2(5.5, 4.5)); // zoom in so the bulged picture still fills the window
      return uv * 0.5 + 0.5;
    }
    // one scanline of the small image, smeared sideways as a tube would
    vec3 row(vec2 px) {
      float x = px.x - 0.5, y = floor(px.y) + 0.5;
      vec3 a = texture2D(tScene, vec2(floor(x) + 0.5, y) / uRes).rgb;
      vec3 b = texture2D(tScene, vec2(floor(x) + 1.5, y) / uRes).rgb;
      return mix(a, b, fract(x));
    }
    void main() {
      vec3 col;
      if (uCrt < 0.5) {
        col = texture2D(tScene, (floor(vUv * uRes) + 0.5) / uRes).rgb;   // plain hard pixels
      } else {
        vec2 uv = curve(vUv);
        vec2 px = uv * uRes;
        // colour fringing: red and blue land slightly apart
        col = vec3(row(px + vec2(0.45, 0.0)).r, row(px).g, row(px - vec2(0.45, 0.0)).b);
        // scanlines: bright in the middle of each row, dark between rows
        col *= mix(0.55, 1.18, pow(sin(fract(px.y) * 3.14159), 1.4));
        // phosphor stripes
        float stripe = mod(floor(gl_FragCoord.x), 3.0);
        col *= vec3(stripe == 0.0 ? 1.1 : 0.94, stripe == 1.0 ? 1.1 : 0.94, stripe == 2.0 ? 1.1 : 0.94);
        // gently darker corners
        float v = uv.x * (1.0 - uv.x) * uv.y * (1.0 - uv.y) * 16.0;
        col *= mix(0.74, 1.08, pow(clamp(v, 0.0, 1.0), 0.3));
      }
      gl_FragColor = vec4(col, 1.0);
      #include <colorspace_fragment>
    }
  `,
  depthTest: false, depthWrite: false,
});
const screenScene = new THREE.Scene();
const screenQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), screenMaterial);
screenQuad.frustumCulled = false;
screenScene.add(screenQuad);
const screenCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// CRT toggle: the button, the C key, or ?crt=off in the URL; the choice is remembered
const crtButton = document.getElementById('crt');
function setCrt(on) {
  screenMaterial.uniforms.uCrt.value = on ? 1 : 0;
  crtButton.textContent = on ? 'CRT: on' : 'CRT: off';
  crtButton.setAttribute('aria-pressed', String(on));
  remember('cherry-crt', on ? 'on' : 'off');
}
setCrt((params.get('crt') || recall('cherry-crt')) !== 'off');
const crtIsOn = () => screenMaterial.uniforms.uCrt.value > 0.5;
crtButton.addEventListener('click', () => setCrt(!crtIsOn()));

function resize() {
  const aspect = innerWidth / innerHeight;
  const h = RENDER_HEIGHT, w = Math.round(h * aspect);
  sceneRT.setSize(w, h);
  screenMaterial.uniforms.uRes.value.set(w, h);
  shared.uSnap.value.set(w / 2, h / 2);
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
}
resize();
addEventListener('resize', resize);

resetView();
if (hint.className !== 'error') setTimeout(() => { hint.style.opacity = 0; }, 6000);

addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const key = e.key.toLowerCase();
  if (key === 'c') setCrt(!crtIsOn());
  if (key === 'r') resetView();
});

// ------------------------------------------------------------------- loop
const clock = new THREE.Clock();
let time = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05) * MOTION;
  time += dt;
  shared.uTime.value = time;
  updateKoi(dt);
  updatePads(time);
  tree?.update?.(dt, time);
  rippleTex.offset.set(time * 0.012, time * 0.007);
  rippleTex2.offset.set(-time * 0.008, time * 0.011);
  controls.update();
  sky.position.copy(camera.position);
  renderer.setRenderTarget(sceneRT);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.render(screenScene, screenCamera);
});
</script>
</body>
</html>
