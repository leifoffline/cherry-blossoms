<!DOCTYPE html>

<style>

{

<script type="module">
// Viewing environment for models built with the low-poly renderer from index.html.
//
// To add a model: write models/<name>.js (see models/cherry-tree.js for the shape of
// one) and add <name> to one of the groups in MODEL_FILES below. It then shows up in
// that section of the picker, and can be opened directly with viewer.html?model=<name>. Other URL options: ?env=room or
// ?env=outdoors, ?crt=off, ?bloom=off, ?spin=on, ?walk=on, ?seed=12, ?variant=<name>.
//
// A model that comes in several versions (see models/koi.js) returns `variants`, a
// list of { name, label }, and `setVariant(name)`; they get a second picker.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Lensflare, LensflareElement } from 'three/addons/objects/Lensflare.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------------------------------------------------------------- settings
// The picker is in two sections: models, the characters that move (and the cat, the
// first, is what opens when nothing else has been chosen), and objects, which stand
// still
const MODEL_FILES = {
  Models: ['cat', 'koi', 'firefly'],
  Objects: ['cherry-tree', 'stone-lantern'],
};
const params = new URLSearchParams(location.search);
const SEED = Number(params.get('seed')) || 3;
// The PS2's standard picture: a 512x448 frame stretched over a 4:3 television,
// so its pixels are a sixth wider than they are tall. The window is not forced
// to that size or shape; it is filled with pixels of that size and shape instead
// (see resize), so a 4:3 window gets exactly 512x448 and a wider one more columns.
const RENDER_WIDTH = 512, RENDER_HEIGHT = 448;
const SUBPIXEL = 16;            // the PS2 placed vertices to a sixteenth of a pixel
const SUN_DIR = new THREE.Vector3(-0.45, 0.42, -0.8).normalize();
const WIND_DIR = new THREE.Vector3(1, 0, 0.35).normalize();

const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOTION = reducedMotion ? 0.35 : 1;
const remember = (key, value) => { try { localStorage.setItem(key, value); } catch {} };
const recall = (key) => { try { return localStorage.getItem(key); } catch { return null; } };

// ------------------------------------------------------------- seeded RNG
function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(SEED);                 // for the backdrop; each model gets its own stream
const rr = (a, b) => a + (b - a) * rand();
const pick = (list) => list[(rand() * list.length) | 0];

// ------------------------------------------------------------ scene setup
const renderer = new THREE.WebGLRenderer({ antialias: false });
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.5, 1200);

// The project's palette, halfway between a bright arcade set and painted
// Japanese-summer backgrounds: a deep cobalt
// sky with shaded white clouds, greens that run from a bluish forest shadow to a
// yellow-green highlight, warm earth and wood, cool grey stone. Each page and
// model file keeps its own copy of the colours it uses; keep them in step.
const PALETTE = {
  skyLight: 0xffffff, groundLight: 0xd8c4bc, sunLight: 0xfff4dc,
  skyTop: [16, 80, 207], skyLow: [94, 167, 244], cloudShade: [168, 192, 224],
  grass: ['#2d7c2f', '#3b9634', '#4fac39', '#67bf40', '#86d14b'],            // dark to light
  grassBlades: ['#a2de55', '#bde96a', '#82cd48', '#24692a', '#1e5b26'],      // three highlights, two shadows
};
const hemi = new THREE.HemisphereLight(PALETTE.skyLight, PALETTE.groundLight, 2.6);
scene.add(hemi);
const sun = new THREE.DirectionalLight(PALETTE.sunLight, 2.0);
sun.position.copy(SUN_DIR).multiplyScalar(50);
scene.add(sun);

// -------------------------------------------------------- painted textures
// Small textures painted in code. They are filtered smoothly, as the PS2 did:
// up close a texel blurs into its neighbours instead of showing as a square
// (`pixelated: true` gives the hard PS1 squares back).
// `cutout: true` is for textures with see-through parts that are cut out by
// alphaTest. Smoothing would otherwise blend the black that lies under the
// transparent pixels into the edges and outline every shape darkly, so the
// colours at the edges are first spread outward under the transparent part; a
// canvas cannot hold a colour in a fully transparent pixel, so these become data
// textures (and cannot be repainted later, as the koi's skin is).
function canvasTexture(w, h, paint, { pixelated = false, mipmaps = !pixelated, cutout = false } = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: cutout });
  paint(ctx, w, h);
  const t = cutout ? cutoutTexture(ctx, w, h) : new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.magFilter = pixelated ? THREE.NearestFilter : THREE.LinearFilter;
  t.generateMipmaps = mipmaps && !cutout;      // smaller copies of a cut-out thin its shapes away at a distance
  t.minFilter = t.generateMipmaps ? THREE.LinearMipmapLinearFilter : (pixelated ? THREE.NearestFilter : THREE.LinearFilter);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function cutoutTexture(ctx, w, h) {
  const d = ctx.getImageData(0, 0, w, h).data, filled = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) filled[i] = d[i * 4 + 3] > 0 ? 1 : 0;
  for (let pass = 0; pass < 4; pass++) {         // each pass carries the colours one pixel further out
    const next = filled.slice();
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (filled[i]) continue;
      let r = 0, g = 0, b = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const X = x + dx, Y = y + dy, j = Y * w + X;
        if (X < 0 || Y < 0 || X >= w || Y >= h || !filled[j]) continue;
        r += d[j * 4]; g += d[j * 4 + 1]; b += d[j * 4 + 2]; n++;
      }
      if (n) { d[i * 4] = r / n; d[i * 4 + 1] = g / n; d[i * 4 + 2] = b / n; next[i] = 1; }
    }
    filled.set(next);
  }
  const flipped = new Uint8Array(w * h * 4);     // a data texture's first row is its bottom one
  for (let y = 0; y < h; y++) flipped.set(d.subarray(y * w * 4, (y + 1) * w * 4), (h - 1 - y) * w * 4);
  const t = new THREE.DataTexture(flipped, w, h, THREE.RGBAFormat);
  t.needsUpdate = true;
  return t;
}

// grass: soft light and dark patches with short blade strokes on top; wraps seamlessly.
// Kept gentle: the patches span only the middle of the greens and blend smoothly from
// one to the next, and the blade strokes are laid on half see-through, so the lawn
// reads as one soft field rather than as dark blotches. Its draws from `rand` stay the
// same in number and order (index.html grows its tree from the same stream).
const GRASS_SIZE = 64;
const grassTex = canvasTexture(GRASS_SIZE, GRASS_SIZE, (ctx, w, h) => {
  const G = 8, grid = Array.from({ length: G * G }, () => rand());
  const patch = (x, y) => {                    // smooth noise that repeats every w pixels
    const fx = (x / w) * G, fy = (y / h) * G, x0 = Math.floor(fx), y0 = Math.floor(fy);
    const u = fx - x0, v = fy - y0, at = (i, j) => grid[((j + G) % G) * G + ((i + G) % G)];
    const L = THREE.MathUtils.lerp;
    return L(L(at(x0, y0), at(x0 + 1, y0), u), L(at(x0, y0 + 1), at(x0 + 1, y0 + 1), u), v);
  };
  const greens = PALETTE.grass.map((c) => new THREE.Color(c)), shade = new THREE.Color();
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const n = 0.5 + 0.55 * (patch(x, y) - 0.5) + 0.3 * rr(-0.16, 0.16);   // squeezed toward the middle
    const t = THREE.MathUtils.clamp(0.4 + 3.4 * n, 0, greens.length - 1.001);   // about the second green to the fourth
    const i = Math.floor(t);
    ctx.fillStyle = '#' + shade.lerpColors(greens[i], greens[i + 1], t - i).getHexString();
    ctx.fillRect(x, y, 1, 1);
  }
  const blades = PALETTE.grassBlades;
  for (let i = 0; i < 520; i++) {
    let x = (rand() * w) | 0, y = (rand() * h) | 0;
    const len = 2 + ((rand() * 4) | 0), lean = rand() < 0.5 ? -1 : 1;
    const colour = pick(blades);
    ctx.fillStyle = colour;
    ctx.globalAlpha = blades.indexOf(colour) >= 3 ? 0.3 : 0.45;           // the two shadows, fainter still
    for (let k = 0; k < len; k++) {
      ctx.fillRect(((x % w) + w) % w, ((y % h) + h) % h, 1, 1);
      y -= 1; if (k % 2 === 1) x += lean;
    }
  }
  ctx.globalAlpha = 1;
});

// sky: blue gradient with wispy clouds, painted once from layered noise; 256 wide, the
// largest texture a PS2 scene would commonly spend on a sky, and smooth rather than pixelled
function hash3(x, y, z) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 2147483647) ^ (SEED * 9781);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const s = (t) => t * t * (3 - 2 * t);
  const u = s(x - xi), v = s(y - yi), w = s(z - zi);
  const L = THREE.MathUtils.lerp;
  const at = (a, b, c) => hash3(xi + a, yi + b, zi + c);
  return L(
    L(L(at(0, 0, 0), at(1, 0, 0), u), L(at(0, 1, 0), at(1, 1, 0), u), v),
    L(L(at(0, 0, 1), at(1, 0, 1), u), L(at(0, 1, 1), at(1, 1, 1), u), v), w);
}
const skyTex = canvasTexture(256, 128, (ctx, w, h) => {
  const img = ctx.createImageData(w, h);
  const density = (a, y) => {                          // how thick the cloud is at angle `a` round the sky, row `y`
    let n = 0, amp = 0.5, f = 1;
    for (let o = 0; o < 5; o++) {
      n += amp * noise3(Math.cos(a) * 2.2 * f, Math.sin(a) * 2.2 * f, (y / h) * 9 * f + o * 7.3);
      amp *= 0.5; f *= 2;
    }
    return n;
  };
  const top = PALETTE.skyTop, low = PALETTE.skyLow;
  for (let y = 0; y < h; y++) {
    const up = Math.max(0, 1 - y / (h / 2));           // 1 at the zenith, 0 at the horizon and below
    for (let x = 0; x < w; x++) {
      const a = (x / w) * Math.PI * 2;                 // sampled around a circle so the seam matches
      const n = density(a, y);
      const cloud = THREE.MathUtils.smoothstep(n, 0.4, 0.62) * THREE.MathUtils.smoothstep(up, 0.02, 0.3);
      // clouds are white on top and blue-grey underneath: a point is in shade
      // by how much cloud there is a little way above it
      const shade = 0.75 * THREE.MathUtils.smoothstep(density(a, y - h * 0.035), 0.46, 0.7);
      const g = Math.pow(up, 0.7);
      const i = (y * w + x) * 4;
      for (let k = 0; k < 3; k++) img.data[i + k] = THREE.MathUtils.lerp(THREE.MathUtils.lerp(low[k], top[k], g), THREE.MathUtils.lerp(255, PALETTE.cloudShade[k], shade), cloud);
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
});
skyTex.wrapT = THREE.ClampToEdgeWrapping;

// ------------------------------------------------ PS2-style vertex shader
// Every material gets vertex snapping, to the PS2's sixteenth of a pixel (a
// whole pixel, SUBPIXEL = 1, gives the heavy wobble of the PS1); the tree
// also gets wind, from one function so bark and blossom move together.
const shared = { uTime: { value: 0 }, uSnap: { value: new THREE.Vector2(160, 120) } };
const PSX_GLSL = /* glsl */`
  uniform float uTime;
  uniform float uWind;
  uniform vec2 uSnap;
  vec3 windOffset(vec3 p) {
    float flex = smoothstep(2.2, 9.0, p.y) * 0.75 + 0.03 * length(p.xz);
    float gust = 0.3
      + 0.6 * sin(uTime * 0.9 + p.x * 0.35 + p.z * 0.25)
      + 0.25 * sin(uTime * 2.3 + p.x * 1.3 + p.y * 0.9);
    vec3 dir = normalize(vec3(1.0, 0.0, 0.35));
    vec3 o = dir * flex * gust * 0.3;
    o.y += sin(uTime * 3.1 + p.x * 2.0 + p.z * 2.0) * 0.03 * flex;
    return o * uWind;
  }
`;
const PSX_PROJECT_GLSL = /* glsl */`
  vec4 wPos = vec4(transformed, 1.0);
  #ifdef USE_INSTANCING
    wPos = instanceMatrix * wPos;
  #endif
  wPos = modelMatrix * wPos;
  wPos.xyz += windOffset(wPos.xyz);
  vec4 mvPosition = viewMatrix * wPos;
  gl_Position = projectionMatrix * mvPosition;
  gl_Position.xy = floor(gl_Position.xy / gl_Position.w * uSnap + 0.5) / uSnap * gl_Position.w;
`;
function psx(material, windAmount = 0) {
  const uWind = { value: windAmount * MOTION };
  material.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = shared.uTime;
    shader.uniforms.uSnap = shared.uSnap;
    shader.uniforms.uWind = uWind;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\n' + PSX_GLSL)
      .replace('#include <project_vertex>', PSX_PROJECT_GLSL);
  };
  material.customProgramCacheKey = () => 'psx';
  return material;
}

// ------------------------------------------------------------ backdrops
// outdoors: the sky, grass and sun from index.html
const outdoors = new THREE.Group();
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(900, 24, 12),
  new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, depthWrite: false, fog: false })
);
sky.renderOrder = -1;
outdoors.add(sky);

const GROUND_R = 600, TEXEL = 0.1;             // world size of one grass pixel
grassTex.repeat.setScalar((GROUND_R * 2) / (GRASS_SIZE * TEXEL));
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(GROUND_R, 24),
  new THREE.MeshLambertMaterial({ map: grassTex })
);
ground.rotation.x = -Math.PI / 2;
outdoors.add(ground);

// grass tufts: little clumps of blades standing up out of the lawn, each two crossed
// cut-out cards (static: the wind in psx is shaped for the tree and would sway them
// by their distance from the middle). The blade picture is painted in greys, dark at the root and light at
// the tips, and every tuft is tinted with the colour of the lawn just under it, read
// back from the grass texture, so it grows out of its own patch instead of standing
// out as a separate green. The cards' normals point straight up, so the lamps light
// them exactly as they light the ground. They keep clear of the model on show (see
// clearTufts) and draw from their own stream, leaving the rest of the backdrop as it was.
const tuftTex = canvasTexture(16, 16, (ctx) => {
  const tuftRand = mulberry32(SEED + 4021);
  for (let i = 0; i < 14; i++) {
    let x = 1 + ((tuftRand() * 14) | 0);
    const top = (tuftRand() * 8) | 0, lean = tuftRand() < 0.5 ? -1 : 1, tone = 0.88 + 0.12 * tuftRand();
    for (let y = 15; y >= top; y--) {
      const v = Math.round(255 * tone * (0.62 + 0.38 * (15 - y) / (15 - top)));   // root dark, tip light
      ctx.fillStyle = `rgb(${v},${v},${v})`;
      ctx.fillRect(Math.min(15, Math.max(0, x)), y, y > 10 ? 2 : 1, 1);
      if ((15 - y) % 4 === 3) x += lean;
    }
  }
}, { cutout: true });
tuftTex.wrapS = tuftTex.wrapT = THREE.ClampToEdgeWrapping;
const TUFT_REACH = 18;                         // they grow out to here; beyond, the texture carries the lawn
const tufts = (() => {
  const tuftRand = mulberry32(SEED + 4022);
  const spots = [];
  for (let c = 0; c < 300; c++) {              // in clumps of a few, as grass grows
    const a = tuftRand() * Math.PI * 2, r = TUFT_REACH * Math.sqrt(tuftRand());
    const n = 2 + ((tuftRand() * 4) | 0);
    for (let k = 0; k < n; k++) {
      const b = tuftRand() * Math.PI * 2, d = 0.4 * tuftRand();
      spots.push({
        x: Math.sin(a) * r + Math.sin(b) * d, z: Math.cos(a) * r + Math.cos(b) * d,
        turn: tuftRand() * Math.PI, width: 0.45 + 0.35 * tuftRand(), height: 0.28 + 0.26 * tuftRand(),
      });
    }
  }
  const card = new THREE.PlaneGeometry(1, 1).translate(0, 0.5, 0);
  // each card twice, back to back and one-sided: a double-sided material would turn
  // the up-pointing normals down on the back faces and light them dark
  const geometry = mergeGeometries([0, 1, 2, 3].map((k) => card.clone().rotateY((k * Math.PI) / 2)));
  card.dispose();
  const normals = geometry.attributes.normal;
  for (let i = 0; i < normals.count; i++) normals.setXYZ(i, 0, 1, 0);
  const mesh = new THREE.InstancedMesh(geometry,
    psx(new THREE.MeshLambertMaterial({ map: tuftTex, alphaTest: 0.5 })), spots.length);
  // the lawn's colour at a spot: the ground's texture coordinates come from the
  // circle's own (0 to 1 across it), repeated, so a point's texel is its position
  // over one tile's width, offset by however far the circle's edge falls into a tile;
  // the canvas is read upside down, as the texture is flipped onto the ground
  const lawn = grassTex.image.getContext('2d').getImageData(0, 0, GRASS_SIZE, GRASS_SIZE).data;
  const TILE_W = GRASS_SIZE * TEXEL, edge = GROUND_R / TILE_W;
  const frac = (v) => v - Math.floor(v);
  const tint = new THREE.Color(), sum = [0, 0, 0];
  spots.forEach((spot, i) => {
    const px = Math.floor(frac(spot.x / TILE_W + edge) * GRASS_SIZE);
    const py = Math.floor((1 - frac(-spot.z / TILE_W + edge)) * GRASS_SIZE);
    sum.fill(0);
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {   // a little round about, past the blade strokes
      const j = (((py + dy + GRASS_SIZE) % GRASS_SIZE) * GRASS_SIZE + ((px + dx + GRASS_SIZE) % GRASS_SIZE)) * 4;
      sum[0] += lawn[j]; sum[1] += lawn[j + 1]; sum[2] += lawn[j + 2];
    }
    // a touch lighter than the ground, as blades catch more light than the turf between them
    tint.setRGB(sum[0] / 9 / 255, sum[1] / 9 / 255, sum[2] / 9 / 255, THREE.SRGBColorSpace).multiplyScalar(1.2);
    mesh.setColorAt(i, tint);
  });
  mesh.userData.spots = spots;
  mesh.frustumCulled = false;
  outdoors.add(mesh);
  return mesh;
})();
// lays the tufts out, leaving a clear circle round the model on show (and room for
// one that walks about) so blades do not grow up through it
function clearTufts(clear) {
  const dummy = new THREE.Object3D();
  tufts.userData.spots.forEach((spot, i) => {
    const out = Math.hypot(spot.x, spot.z) > clear;
    dummy.position.set(spot.x, 0, spot.z);
    dummy.rotation.y = spot.turn;
    dummy.scale.set(out ? spot.width : 0, out ? spot.height : 0, out ? spot.width : 0);
    dummy.updateMatrix();
    tufts.setMatrixAt(i, dummy.matrix);
  });
  tufts.instanceMatrix.needsUpdate = true;
}

{
  const glow = canvasTexture(64, 64, (ctx) => {
    const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(255,250,220,0.7)'); g.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
  }, { pixelated: false });
  const hexagon = canvasTexture(64, 64, (ctx) => {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) ctx.lineTo(32 + 29 * Math.cos((i * Math.PI) / 3), 32 + 29 * Math.sin((i * Math.PI) / 3));
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
  }, { pixelated: false });
  const flare = new Lensflare();
  flare.position.copy(SUN_DIR).multiplyScalar(800);
  flare.addElement(new LensflareElement(glow, 80, 0, new THREE.Color(0xffffff)));
  flare.addElement(new LensflareElement(hexagon, 26, 0.3, new THREE.Color(0x9a8cff)));
  flare.addElement(new LensflareElement(hexagon, 46, 0.5, new THREE.Color(0x7f9dff)));
  flare.addElement(new LensflareElement(hexagon, 34, 0.75, new THREE.Color(0x8fe0b0)));
  flare.addElement(new LensflareElement(hexagon, 22, 1.0, new THREE.Color(0xb0c8ff)));
  outdoors.add(flare);
}
scene.add(outdoors);

// white room: a box seen from the inside, each surface a slightly different white so
// the corners read, and a faint tiled floor to give a sense of scale
const TILE = 2;                                // world size of one floor tile
const floorTex = canvasTexture(16, 16, (ctx) => {
  ctx.fillStyle = '#ebebef'; ctx.fillRect(0, 0, 16, 16);
  ctx.fillStyle = '#d3d3da'; ctx.fillRect(0, 0, 16, 1); ctx.fillRect(0, 0, 1, 16);
});
const wall = (color) => new THREE.MeshBasicMaterial({ color, side: THREE.BackSide });
const room = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), [
  wall(0xf3f3f6), wall(0xf3f3f6),                                   // +x, -x
  wall(0xffffff),                                                   // ceiling
  new THREE.MeshBasicMaterial({ map: floorTex, side: THREE.BackSide }),
  wall(0xfafafc), wall(0xfafafc),                                   // +z, -z
]);
scene.add(room);

// soft round shadow under whatever is on show
const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(1, 14),
  new THREE.MeshBasicMaterial({ color: 0x0a3010, transparent: true, opacity: 0.38, depthWrite: false })
);
shadow.rotation.x = -Math.PI / 2;
shadow.renderOrder = 1;
scene.add(shadow);

const envButton = document.getElementById('env');
let env = 'outdoors';
function setEnv(name) {
  env = name === 'room' ? 'room' : 'outdoors';
  const inRoom = env === 'room';
  outdoors.visible = !inRoom;
  room.visible = inRoom;
  scene.background = inRoom ? new THREE.Color(0xffffff) : null;
  hemi.groundColor.set(inRoom ? 0xd0d0d6 : PALETTE.groundLight);   // light bounced off the floor
  shadow.material.color.set(inRoom ? 0x30303a : 0x0a3010);
  shadow.material.opacity = inRoom ? 0.22 : 0.38;
  envButton.textContent = inRoom ? 'BG: white room' : 'BG: outdoors';
  document.body.dataset.env = env;
  remember('viewer-env', env);
}
setEnv(params.get('env') || recall('viewer-env'));
envButton.addEventListener('click', () => setEnv(env === 'room' ? 'outdoors' : 'room'));

// ------------------------------------------------------ camera + controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minPolarAngle = 0.15;
controls.maxPolarAngle = 1.72;                 // a little below level, never under the floor
controls.autoRotateSpeed = 0.7;

// the camera only moves when dragged, unless spin is switched on: the button, the S
// key, or ?spin=on in the URL; the choice is remembered
const spinButton = document.getElementById('spin');
function setSpin(on) {
  controls.autoRotate = on;
  spinButton.textContent = on ? 'SPIN: on' : 'SPIN: off';
  spinButton.setAttribute('aria-pressed', String(on));
  remember('viewer-spin', on ? 'on' : 'off');
}
setSpin((params.get('spin') || recall('viewer-spin')) === 'on');
spinButton.addEventListener('click', () => setSpin(!controls.autoRotate));

// ------------------------------------------------- low-res target + screen
// The scene is drawn into a small image, then one full-window pass puts it on
// screen: either stretched smoothly, which is the soft picture a PS2 gave over a
// good cable, or through the CRT filter.
const sceneRT = new THREE.WebGLRenderTarget(1, 1, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
});
const screenMaterial = new THREE.ShaderMaterial({
  uniforms: {
    tScene: { value: sceneRT.texture },
    uRes: { value: new THREE.Vector2(1, 1) },   // size of the small image
    uCrt: { value: 1 },
    tBloom: { value: null },                    // the blurred glow, see bloom below
    uBloom: { value: 0 },                       // how much of it to add; 0 = off
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D tScene;
    uniform vec2 uRes;
    uniform float uCrt;
    uniform sampler2D tBloom;
    uniform float uBloom;
    varying vec2 vUv;

    // the small image with its glow added
    vec3 picture(vec2 uv) { return texture2D(tScene, uv).rgb + uBloom * texture2D(tBloom, uv).rgb; }

    // bulge the picture like curved glass
    vec2 curve(vec2 uv) {
      uv = uv * 2.0 - 1.0;
      vec2 off = abs(uv.yx) / vec2(5.5, 4.5);
      uv += uv * off * off;
      uv /= 1.0 + 1.0 / (vec2(5.5, 4.5) * vec2(5.5, 4.5)); // zoom in so the bulged picture still fills the window
      return uv * 0.5 + 0.5;
    }
    // one scanline of the small image, smeared sideways as a tube would
    vec3 row(vec2 px) {
      float x = px.x - 0.5, y = floor(px.y) + 0.5;
      vec3 a = picture(vec2(floor(x) + 0.5, y) / uRes);
      vec3 b = picture(vec2(floor(x) + 1.5, y) / uRes);
      return mix(a, b, fract(x));
    }
    void main() {
      vec3 col;
      if (uCrt < 0.5) {
        col = picture(vUv);                              // stretched smoothly over the window
      } else {
        vec2 uv = curve(vUv);
        vec2 px = uv * uRes;
        // colour fringing: red and blue land slightly apart
        col = vec3(row(px + vec2(0.45, 0.0)).r, row(px).g, row(px - vec2(0.45, 0.0)).b);
        // scanlines: bright in the middle of each row, dark between rows. With 448
        // rows a row is only two or three screen pixels tall in most windows, too
        // few to draw a dark gap without moire, so the lines fade out to their
        // average brightness as the rows get that thin
        float rowPx = 1.0 / fwidth(px.y);
        float scan = mix(0.55, 1.18, pow(sin(fract(px.y) * 3.14159), 1.4));
        col *= mix(0.95, scan, smoothstep(2.0, 4.0, rowPx));
        // phosphor stripes
        float stripe = mod(floor(gl_FragCoord.x), 3.0);
        col *= vec3(stripe == 0.0 ? 1.1 : 0.94, stripe == 1.0 ? 1.1 : 0.94, stripe == 2.0 ? 1.1 : 0.94);
        // gently darker corners
        float v = uv.x * (1.0 - uv.x) * uv.y * (1.0 - uv.y) * 16.0;
        col *= mix(0.74, 1.08, pow(clamp(v, 0.0, 1.0), 0.3));
      }
      gl_FragColor = vec4(col, 1.0);
      #include <colorspace_fragment>
    }
  `,
  depthTest: false, depthWrite: false,
});
const screenScene = new THREE.Scene();
const screenQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), screenMaterial);
screenQuad.frustumCulled = false;
screenScene.add(screenQuad);
const screenCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// ------------------------------------------------------------------- bloom
// Bright parts of the picture glow, as in PS2 games that drew the frame over itself
// blurred: whatever in the small image is brighter than BLOOM_THRESHOLD is copied
// to a quarter-size image, blurred across and then down, and the screen pass adds
// the result on top. Toggle: the button, the G key, or ?bloom=off in the URL; the
// choice is remembered.
const BLOOM_SCALE = 4, BLOOM_THRESHOLD = 0.68, BLOOM_STRENGTH = 0.4;
const bloomRT = [0, 1].map(() => new THREE.WebGLRenderTarget(1, 1, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false,
}));
screenMaterial.uniforms.tBloom.value = bloomRT[1].texture;
const bloomMaterial = new THREE.ShaderMaterial({
  uniforms: {
    tMap: { value: null },
    uStep: { value: new THREE.Vector2() },      // from one blur tap to the next
    uSpread: { value: new THREE.Vector2() },    // each tap is two samples this far either side, to take in every row when shrinking
    uThreshold: { value: 0 },                   // 0 = keep everything (the second pass)
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D tMap;
    uniform vec2 uStep, uSpread;
    uniform float uThreshold;
    varying vec2 vUv;
    vec3 tap(float i) {
      vec2 at = vUv + uStep * i;
      vec3 c = 0.5 * (texture2D(tMap, at + uSpread).rgb + texture2D(tMap, at - uSpread).rgb);
      float bright = dot(c, vec3(0.299, 0.587, 0.114));   // by eye, so the deep blue sky stays calm
      return uThreshold > 0.0 ? c * smoothstep(uThreshold, uThreshold + 0.3, bright) : c;
    }
    void main() {
      vec3 sum = tap(0.0) * 0.204;
      sum += (tap(1.0) + tap(-1.0)) * 0.180;
      sum += (tap(2.0) + tap(-2.0)) * 0.124;
      sum += (tap(3.0) + tap(-3.0)) * 0.066;
      sum += (tap(4.0) + tap(-4.0)) * 0.028;
      gl_FragColor = vec4(sum, 1.0);
    }
  `,
  depthTest: false, depthWrite: false,
});
const bloomScene = new THREE.Scene();
const bloomQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bloomMaterial);
bloomQuad.frustumCulled = false;
bloomScene.add(bloomQuad);
// call once the scene has been drawn into sceneRT
function renderBloom() {
  if (!bloomIsOn()) return;
  const u = bloomMaterial.uniforms, { width, height } = bloomRT[0];
  u.tMap.value = sceneRT.texture;
  u.uStep.value.set(1 / width, 0); u.uSpread.value.set(0, 0.25 / height); u.uThreshold.value = BLOOM_THRESHOLD;
  renderer.setRenderTarget(bloomRT[0]);
  renderer.render(bloomScene, screenCamera);
  u.tMap.value = bloomRT[0].texture;
  u.uStep.value.set(0, 1 / height); u.uSpread.value.set(0, 0); u.uThreshold.value = 0;
  renderer.setRenderTarget(bloomRT[1]);
  renderer.render(bloomScene, screenCamera);
}
const bloomButton = document.getElementById('bloom');
function setBloom(on) {
  screenMaterial.uniforms.uBloom.value = on ? BLOOM_STRENGTH : 0;
  bloomButton.textContent = on ? 'BLOOM: on' : 'BLOOM: off';
  bloomButton.setAttribute('aria-pressed', String(on));
  remember('cherry-bloom', on ? 'on' : 'off');
}
const bloomIsOn = () => screenMaterial.uniforms.uBloom.value > 0;
setBloom((params.get('bloom') || recall('cherry-bloom')) !== 'off');
bloomButton.addEventListener('click', () => setBloom(!bloomIsOn()));

// CRT toggle: the button, the C key, or ?crt=off in the URL; the choice is remembered
const crtButton = document.getElementById('crt');
function setCrt(on) {
  screenMaterial.uniforms.uCrt.value = on ? 1 : 0;
  crtButton.textContent = on ? 'CRT: on' : 'CRT: off';
  crtButton.setAttribute('aria-pressed', String(on));
  remember('cherry-crt', on ? 'on' : 'off');
}
setCrt((params.get('crt') || recall('cherry-crt')) !== 'off');
const crtIsOn = () => screenMaterial.uniforms.uCrt.value > 0.5;
crtButton.addEventListener('click', () => setCrt(!crtIsOn()));

function resize() {
  const aspect = innerWidth / innerHeight;
  // RENDER_WIDTH columns span a 4:3 picture; a window of another shape keeps
  // the same pixel width and simply shows more or fewer of them
  const h = RENDER_HEIGHT, w = Math.round(RENDER_WIDTH * aspect / (4 / 3));
  sceneRT.setSize(w, h);
  for (const rt of bloomRT) rt.setSize(Math.ceil(w / BLOOM_SCALE), Math.ceil(h / BLOOM_SCALE));
  screenMaterial.uniforms.uRes.value.set(w, h);
  shared.uSnap.value.set(w / 2 * SUBPIXEL, h / 2 * SUBPIXEL);
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
}
resize();
addEventListener('resize', resize);

// ------------------------------------------------------------------ models
const registry = new Map();
window.THREE = THREE;
window.registerModel = (def) => registry.set(def.name, def);

const hint = document.getElementById('hint');
function fail(message, error) {
  if (error) console.error(error);
  hint.textContent = message;
  hint.className = 'error';
  hint.style.opacity = 1;
}

// model files are plain scripts, not modules, so the page also works opened straight from disk
const loadScript = (src) => new Promise((resolve) => {
  const s = document.createElement('script');
  s.src = src;
  s.onload = resolve;
  s.onerror = () => { fail(`could not load ${src}`); resolve(); };
  document.head.appendChild(s);
});

let current = null;                            // { object, update, bounds }
const shadowBase = new THREE.Vector3();        // where the shadow sits when the model stands at home

// a model that can walk about (it returns setWalking) gets the WALK button: the
// button, the W key, or ?walk=on in the URL; the choice is remembered
const walkButton = document.getElementById('walk');
let walkOn = (params.get('walk') || recall('viewer-walk')) === 'on';
function setWalk(on) {
  walkOn = on;
  walkButton.textContent = on ? 'WALK: on' : 'WALK: off';
  walkButton.setAttribute('aria-pressed', String(on));
  remember('viewer-walk', on ? 'on' : 'off');
  current?.setWalking?.(on);
}
walkButton.addEventListener('click', () => setWalk(!walkOn));
const frame = { target: new THREE.Vector3(), dist: 10, rise: 0, turn: 0 };

function disposeModel(object) {
  object.traverse((o) => {
    o.geometry?.dispose();
    for (const m of [].concat(o.material || [])) {
      for (const v of Object.values(m)) if (v?.isTexture) v.dispose();
      m.dispose();
    }
  });
}

function resetView() {
  controls.target.copy(frame.target);
  camera.position.set(
    frame.target.x + Math.sin(frame.turn) * frame.dist, frame.target.y + frame.rise,
    frame.target.z + Math.cos(frame.turn) * frame.dist);
  controls.update();
}

function showModel(name) {
  const def = registry.get(name);
  if (!def) return;
  if (current) { scene.remove(current.object); disposeModel(current.object); current = null; }
  let built;
  try {
    built = def.build({
      THREE, psx, canvasTexture, mergeGeometries,
      rand: mulberry32(SEED), seed: SEED, sunDir: SUN_DIR, windDir: WIND_DIR,
    });
  } catch (error) {
    return fail(`${name} failed to build: ${error.message}`, error);
  }
  current = built.isObject3D ? { object: built } : built;
  scene.add(current.object);

  // fit the camera, shadow and room to the model
  const box = current.bounds || new THREE.Box3().setFromObject(current.object);
  const size = box.getSize(new THREE.Vector3()), mid = box.getCenter(new THREE.Vector3());
  const top = Math.max(box.max.y, 0.01), radius = Math.max(size.x, size.z, 0.01) / 2;
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const fit = Math.max((top / 2) / tanV, radius / (tanV * camera.aspect));
  frame.target.set(mid.x, top * 0.5, mid.z);
  // a model can adjust its opening view: `back` steps the camera away (1 = snug fit),
  // `rise` sets its height against the model's middle, as a share of the model's height
  // (the default sits a little below, looking slightly up), `turn` swings it round the
  // model, in radians
  const view = { back: 1, rise: -0.12, turn: 0, ...current.view };
  frame.dist = (fit * 1.05 + radius * 0.4) * view.back;
  frame.rise = top * view.rise;
  frame.turn = view.turn;
  controls.minDistance = Math.max(Math.min(1, radius), radius * 0.6);
  // a model far smaller than the rest (the firefly) is framed from so close that the
  // usual near plane would cut into it
  camera.near = Math.min(0.5, controls.minDistance * 0.2);
  camera.updateProjectionMatrix();
  controls.maxDistance = Math.max(24, frame.dist * 1.6);

  // round, unless the model gives the half-widths of its own footprint
  shadow.scale.set(current.shadow?.x ?? radius * 0.95, current.shadow?.z ?? radius * 0.95, 1);
  shadow.position.set(mid.x, Math.min(0.03, top * 0.02), mid.z);     // just clear of the floor, at the model's own scale
  shadowBase.copy(shadow.position);
  // grass keeps off the model's footprint; a model that walks about (the cat wanders
  // up to 2.5 from the middle) needs that much more room
  clearTufts(radius * 1.15 + (current.setWalking ? 2.8 : 0));

  const width = controls.maxDistance * 2 + 6, height = Math.max(16, top * 2);  // the camera stays inside
  room.scale.set(width, height, width);
  room.position.set(mid.x, height / 2, mid.z);
  floorTex.repeat.setScalar(width / TILE);

  resetView();
  listVariants(name);
  walkButton.hidden = !current.setWalking;
  if (current.setWalking) setWalk(walkOn);
  picker.value = name;
  document.title = `${def.label || name} · Model Viewer`;
  remember('viewer-model', name);
}

// variants of the model on show: the second picker, the V key, or ?variant= in the URL;
// the choice is remembered for each model
const variantPicker = document.getElementById('variant');
let urlVariant = params.get('variant');
function setVariant(name) {
  current.setVariant(name);
  variantPicker.value = name;
  remember(`viewer-variant-${picker.value}`, name);
}
function listVariants(model) {
  const variants = current.variants || [];
  variantPicker.replaceChildren(...variants.map((v) => new Option(v.label || v.name, v.name)));
  variantPicker.hidden = !variants.length;
  variantPicker.setAttribute('aria-label', current.variantLabel || 'Variant');
  if (!variants.length) return;
  const wanted = urlVariant || recall(`viewer-variant-${model}`);
  urlVariant = null;
  picker.value = model;
  setVariant(variants.some((v) => v.name === wanted) ? wanted : variants[0].name);
}
function nextVariant() {
  const n = variantPicker.options.length;
  if (n) setVariant(variantPicker.options[(variantPicker.selectedIndex + 1) % n].value);
}
variantPicker.addEventListener('change', () => { setVariant(variantPicker.value); variantPicker.blur(); });

const picker = document.getElementById('model');
picker.addEventListener('change', () => { showModel(picker.value); picker.blur(); });

for (const [section, files] of Object.entries(MODEL_FILES)) {
  const group = document.createElement('optgroup');
  group.label = section;
  for (const file of files) {
    const before = new Set(registry.keys());
    await loadScript(`models/${file}.js`);
    for (const [name, def] of registry) if (!before.has(name)) group.append(new Option(def.label || name, name));
  }
  if (group.children.length) picker.append(group);
}
if (registry.size) {
  const wanted = params.get('model') || recall('viewer-model');
  showModel(registry.has(wanted) ? wanted : registry.keys().next().value);
  if (hint.className !== 'error') setTimeout(() => { hint.style.opacity = 0; }, 6000);
} else if (hint.className !== 'error') {
  fail('no models: add one to a group in MODEL_FILES in viewer.html');
}

addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.target === picker || e.target === variantPicker) return;
  const key = e.key.toLowerCase();
  if (key === 'c') setCrt(!crtIsOn());
  if (key === 'g') setBloom(!bloomIsOn());
  if (key === 'b') setEnv(env === 'room' ? 'outdoors' : 'room');
  if (key === 's') setSpin(!controls.autoRotate);
  if (key === 'w' && current?.setWalking) setWalk(!walkOn);
  if (key === 'r') resetView();
  if (key === 'v') nextVariant();
});

// ------------------------------------------------------------------- loop
const clock = new THREE.Clock();
let time = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05) * MOTION;
  time += dt;
  shared.uTime.value = time;
  current?.update?.(dt, time);
  if (current) {                               // the shadow keeps under a model that walks about
    shadow.position.x = shadowBase.x + current.object.position.x;
    shadow.position.z = shadowBase.z + current.object.position.z;
  }
  controls.update();
  sky.position.copy(camera.position);
  renderer.setRenderTarget(sceneRT);
  renderer.render(scene, camera);
  renderBloom();
  renderer.setRenderTarget(null);
  renderer.render(screenScene, screenCamera);
});
</script>
</body>
</html>
