<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cherry Blossom · Low Poly</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; cursor: grab; }

  #hint {
    position: fixed; left: 0; right: 0; bottom: 18px; text-align: center;
    font: bold 13px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;

    pointer-events: none; transition: opacity 2s;
  }
  .bar { position: fixed; top: 14px; right: 14px; display: flex; gap: 8px; }
  .bar button {

    opacity: 0.6; cursor: pointer;
  }
  .bar button:hover, .bar button:focus-visible { opacity: 1; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hint">drag to orbit · scroll to zoom · C for CRT · G for bloom</div>
<div class="bar"><button id="bloom" type="button" aria-pressed="true">BLOOM: on</button><button id="crt" type="button" aria-pressed="true">CRT: on</button></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Lensflare, LensflareElement } from 'three/addons/objects/Lensflare.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------------------------------------------------------------- settings
const SEED = Number(new URLSearchParams(location.search).get('seed')) || 3; // or add ?seed=12 to the URL
// The PS2's standard picture: a 512x448 frame stretched over a 4:3 television,
// so its pixels are a sixth wider than they are tall. The window is not forced
// to that size or shape; it is filled with pixels of that size and shape instead
// (see resize), so a 4:3 window gets exactly 512x448 and a wider one more columns.
const RENDER_WIDTH = 512, RENDER_HEIGHT = 448;
const SUBPIXEL = 16;            // the PS2 placed vertices to a sixteenth of a pixel
const PETAL_COUNT = 160;
const IDLE_SECONDS = 10;        // the camera starts orbiting by itself after this long without input
const SUN_DIR = new THREE.Vector3(-0.45, 0.42, -0.8).normalize();
const WIND_DIR = new THREE.Vector3(1, 0, 0.35).normalize();
// The project's palette, halfway between a bright arcade set and painted
// Japanese-summer backgrounds: a deep cobalt
// sky with shaded white clouds, greens that run from a bluish forest shadow to a
// yellow-green highlight, warm earth and wood, cool grey stone. Each page and
// model file keeps its own copy of the colours it uses; keep them in step.
const PALETTE = {
  skyLight: 0xffffff, groundLight: 0xd8c4bc, sunLight: 0xfff4dc,
  skyTop: [16, 80, 207], skyLow: [94, 167, 244], cloudShade: [168, 192, 224],
  grass: ['#2d7c2f', '#3b9634', '#4fac39', '#67bf40', '#86d14b'],            // dark to light
  grassBlades: ['#a2de55', '#bde96a', '#82cd48', '#24692a', '#1e5b26'],      // three highlights, two shadows
  bark: 0x835d45,
  blossoms: [0xfee6ef, 0xfcd2e2, 0xfac0d6, 0xf7aeca],
  petal: 0xfac4d9,
};

const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOTION = reducedMotion ? 0.35 : 1;

// ------------------------------------------------------------- seeded RNG
function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(SEED);
const rr = (a, b) => a + (b - a) * rand();
const pick = (list) => list[(rand() * list.length) | 0];
const randomUnit = () =>
  new THREE.Vector3(rr(-1, 1), rr(-1, 1), rr(-1, 1)).normalize();

// ------------------------------------------------------------ scene setup
const renderer = new THREE.WebGLRenderer({ antialias: false });
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.5, 1200);

scene.add(new THREE.HemisphereLight(PALETTE.skyLight, PALETTE.groundLight, 2.6));
const sun = new THREE.DirectionalLight(PALETTE.sunLight, 2.0);
sun.position.copy(SUN_DIR).multiplyScalar(50);
scene.add(sun);

// -------------------------------------------------------- painted textures
// Small textures painted in code. They are filtered smoothly, as the PS2 did:
// up close a texel blurs into its neighbours instead of showing as a square
// (`pixelated: true` gives the hard PS1 squares back).
// `cutout: true` is for textures with see-through parts that are cut out by
// alphaTest. Smoothing would otherwise blend the black that lies under the
// transparent pixels into the edges and outline every shape darkly, so the
// colours at the edges are first spread outward under the transparent part; a
// canvas cannot hold a colour in a fully transparent pixel, so these become data
// textures (and cannot be repainted later, as the koi's skin is).
function canvasTexture(w, h, paint, { pixelated = false, mipmaps = !pixelated, cutout = false } = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: cutout });
  paint(ctx, w, h);
  const t = cutout ? cutoutTexture(ctx, w, h) : new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.magFilter = pixelated ? THREE.NearestFilter : THREE.LinearFilter;
  t.generateMipmaps = mipmaps && !cutout;      // smaller copies of a cut-out thin its shapes away at a distance
  t.minFilter = t.generateMipmaps ? THREE.LinearMipmapLinearFilter : (pixelated ? THREE.NearestFilter : THREE.LinearFilter);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function cutoutTexture(ctx, w, h) {
  const d = ctx.getImageData(0, 0, w, h).data, filled = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) filled[i] = d[i * 4 + 3] > 0 ? 1 : 0;
  for (let pass = 0; pass < 4; pass++) {         // each pass carries the colours one pixel further out
    const next = filled.slice();
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (filled[i]) continue;
      let r = 0, g = 0, b = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const X = x + dx, Y = y + dy, j = Y * w + X;
        if (X < 0 || Y < 0 || X >= w || Y >= h || !filled[j]) continue;
        r += d[j * 4]; g += d[j * 4 + 1]; b += d[j * 4 + 2]; n++;
      }
      if (n) { d[i * 4] = r / n; d[i * 4 + 1] = g / n; d[i * 4 + 2] = b / n; next[i] = 1; }
    }
    filled.set(next);
  }
  const flipped = new Uint8Array(w * h * 4);     // a data texture's first row is its bottom one
  for (let y = 0; y < h; y++) flipped.set(d.subarray(y * w * 4, (y + 1) * w * 4), (h - 1 - y) * w * 4);
  const t = new THREE.DataTexture(flipped, w, h, THREE.RGBAFormat);
  t.needsUpdate = true;
  return t;
}

// grass: soft light and dark patches with short blade strokes on top; wraps seamlessly
const GRASS_SIZE = 64;
const grassTex = canvasTexture(GRASS_SIZE, GRASS_SIZE, (ctx, w, h) => {
  const G = 8, grid = Array.from({ length: G * G }, () => rand());
  const patch = (x, y) => {                    // smooth noise that repeats every w pixels
    const fx = (x / w) * G, fy = (y / h) * G, x0 = Math.floor(fx), y0 = Math.floor(fy);
    const u = fx - x0, v = fy - y0, at = (i, j) => grid[((j + G) % G) * G + ((i + G) % G)];
    const L = THREE.MathUtils.lerp;
    return L(L(at(x0, y0), at(x0 + 1, y0), u), L(at(x0, y0 + 1), at(x0 + 1, y0 + 1), u), v);
  };
  const greens = PALETTE.grass;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const n = patch(x, y) + rr(-0.16, 0.16);
    ctx.fillStyle = greens[THREE.MathUtils.clamp(Math.floor(n * greens.length), 0, greens.length - 1)];
    ctx.fillRect(x, y, 1, 1);
  }
  const blades = PALETTE.grassBlades;
  for (let i = 0; i < 520; i++) {
    let x = (rand() * w) | 0, y = (rand() * h) | 0;
    const len = 2 + ((rand() * 4) | 0), lean = rand() < 0.5 ? -1 : 1;
    ctx.fillStyle = pick(blades);
    for (let k = 0; k < len; k++) {
      ctx.fillRect(((x % w) + w) % w, ((y % h) + h) % h, 1, 1);
      y -= 1; if (k % 2 === 1) x += lean;
    }
  }
});

// Texture sizes follow PS2 practice: a main object gets about one 128x128 sheet's
// worth (here bark 32x64 plus blossom 64x64), background and props 64x64 or less.
// The layout of each texture comes from the seeded stream, in the same order and
// number of draws as when these were a quarter the size, so a seed still grows the
// same tree; the fine detail comes from `grain`, a fixed pattern.
const grain = (x, y) => {
  let h = Math.imul(x + 1, 374761393) ^ Math.imul(y + 1, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};
// bark: eight streaks running up the trunk, broken into ragged fibres, with
// darker grooves between them and a little grit
const barkTex = canvasTexture(32, 64, (ctx) => {
  const browns = ['#ffffff', '#e6d8cf', '#cdbbae', '#f2e8e2'];
  const coarse = [];
  for (let x = 0; x < 8; x++) {
    const streak = pick(browns), column = [];
    for (let y = 0; y < 16; y++) column.push(rand() < 0.3 ? pick(browns) : streak);
    coarse.push(column);
  }
  for (let x = 0; x < 32; x++) {
    const slip = (grain(x, 99) * 4) | 0;         // each fibre sits a little higher or lower than its neighbour
    for (let y = 0; y < 64; y++) {
      const g = grain(x, y);
      ctx.fillStyle = x % 4 === 0 && grain(x, y >> 3) < 0.55 ? '#b09c8e'
        : g < 0.06 ? '#bba898' : g > 0.95 ? '#ffffff'
        : coarse[x >> 2][((y + slip) >> 2) % 16];
      ctx.fillRect(x, y, 1, 1);
    }
  }
});

// a bunch of blossom: five-petal flowers scattered on a transparent square,
// thicker in the middle and ragged at the edge, with a few dark buds
const blossomTex = canvasTexture(64, 64, (ctx) => {
  const petals = ['#ffffff', '#ffffff', '#fff2f7', '#ffe4ee', '#ffd6e6'];
  const dot = (x, y) => { ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y - 1, 1, 3); };   // a small round blob
  const flower = (x, y) => {
    const colour = pick(petals);
    const turn = rand() < 0.6 ? ((rand() * 2) | 0) * 0.5 + ((rand() * 2) | 0) * 0.25 + 0.2 : 0;   // which way up it faces
    for (let k = 0; k < 5; k++) {
      const a = turn + k * 1.2566 - 1.5708, px = Math.round(x + Math.cos(a) * 2.4), py = Math.round(y + Math.sin(a) * 2.4);
      ctx.fillStyle = colour; dot(px, py);
      if (Math.sin(a) > 0.3) { ctx.fillStyle = '#ffc9dd'; ctx.fillRect(Math.round(x + Math.cos(a) * 3.4), Math.round(y + Math.sin(a) * 3.4), 1, 1); }   // lower petals shaded at the tip
    }
    ctx.fillStyle = rand() < 0.5 ? '#e87aa4' : '#f29dbd'; dot(x, y);   // centre
    ctx.fillStyle = '#d2578a'; ctx.fillRect(x, y, 1, 1);
  };
  for (let i = 0; i < 9; i++) {                 // buds behind the flowers
    const a = rr(0, 6.28), r = rr(2, 13) * 2;
    const x = Math.round(32 + Math.cos(a) * r), y = Math.round(32 + Math.sin(a) * r);
    ctx.fillStyle = pick(['#c2567f', '#a8506a', '#8a5a48']); ctx.fillRect(x, y, 2, 2);
    ctx.fillStyle = '#e08aa8'; ctx.fillRect(x, y, 1, 1);
  }
  for (let i = 0; i < 46; i++) {
    const a = rr(0, 6.28), r = Math.pow(rand(), 0.75) * 26;
    flower(Math.round(32 + Math.cos(a) * r), Math.round(32 + Math.sin(a) * r));
  }
}, { cutout: true });

// sky: blue gradient with wispy clouds, painted once from layered noise; 256 wide, the
// largest texture a PS2 scene would commonly spend on a sky, and smooth rather than pixelled
function hash3(x, y, z) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 2147483647) ^ (SEED * 9781);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const s = (t) => t * t * (3 - 2 * t);
  const u = s(x - xi), v = s(y - yi), w = s(z - zi);
  const L = THREE.MathUtils.lerp;
  const at = (a, b, c) => hash3(xi + a, yi + b, zi + c);
  return L(
    L(L(at(0, 0, 0), at(1, 0, 0), u), L(at(0, 1, 0), at(1, 1, 0), u), v),
    L(L(at(0, 0, 1), at(1, 0, 1), u), L(at(0, 1, 1), at(1, 1, 1), u), v), w);
}
const skyTex = canvasTexture(256, 128, (ctx, w, h) => {
  const img = ctx.createImageData(w, h);
  const density = (a, y) => {                          // how thick the cloud is at angle `a` round the sky, row `y`
    let n = 0, amp = 0.5, f = 1;
    for (let o = 0; o < 5; o++) {
      n += amp * noise3(Math.cos(a) * 2.2 * f, Math.sin(a) * 2.2 * f, (y / h) * 9 * f + o * 7.3);
      amp *= 0.5; f *= 2;
    }
    return n;
  };
  const top = PALETTE.skyTop, low = PALETTE.skyLow;
  for (let y = 0; y < h; y++) {
    const up = Math.max(0, 1 - y / (h / 2));           // 1 at the zenith, 0 at the horizon and below
    for (let x = 0; x < w; x++) {
      const a = (x / w) * Math.PI * 2;                 // sampled around a circle so the seam matches
      const n = density(a, y);
      const cloud = THREE.MathUtils.smoothstep(n, 0.4, 0.62) * THREE.MathUtils.smoothstep(up, 0.02, 0.3);
      // clouds are white on top and blue-grey underneath: a point is in shade
      // by how much cloud there is a little way above it
      const shade = 0.75 * THREE.MathUtils.smoothstep(density(a, y - h * 0.035), 0.46, 0.7);
      const g = Math.pow(up, 0.7);
      const i = (y * w + x) * 4;
      for (let k = 0; k < 3; k++) img.data[i + k] = THREE.MathUtils.lerp(THREE.MathUtils.lerp(low[k], top[k], g), THREE.MathUtils.lerp(255, PALETTE.cloudShade[k], shade), cloud);
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
});
skyTex.wrapT = THREE.ClampToEdgeWrapping;

// ------------------------------------------------ PS2-style vertex shader
// Every material gets vertex snapping, to the PS2's sixteenth of a pixel (a
// whole pixel, SUBPIXEL = 1, gives the heavy wobble of the PS1); the tree
// also gets wind, from one function so bark and blossom move together.
const shared = { uTime: { value: 0 }, uSnap: { value: new THREE.Vector2(160, 120) } };
const PSX_GLSL = /* glsl */`
  uniform float uTime;
  uniform float uWind;
  uniform vec2 uSnap;
  vec3 windOffset(vec3 p) {
    float flex = smoothstep(2.2, 9.0, p.y) * 0.75 + 0.03 * length(p.xz);
    float gust = 0.3
      + 0.6 * sin(uTime * 0.9 + p.x * 0.35 + p.z * 0.25)
      + 0.25 * sin(uTime * 2.3 + p.x * 1.3 + p.y * 0.9);
    vec3 dir = normalize(vec3(1.0, 0.0, 0.35));
    vec3 o = dir * flex * gust * 0.3;
    o.y += sin(uTime * 3.1 + p.x * 2.0 + p.z * 2.0) * 0.03 * flex;
    return o * uWind;
  }
`;
const PSX_PROJECT_GLSL = /* glsl */`
  vec4 wPos = vec4(transformed, 1.0);
  #ifdef USE_INSTANCING
    wPos = instanceMatrix * wPos;
  #endif
  wPos = modelMatrix * wPos;
  wPos.xyz += windOffset(wPos.xyz);
  vec4 mvPosition = viewMatrix * wPos;
  gl_Position = projectionMatrix * mvPosition;
  gl_Position.xy = floor(gl_Position.xy / gl_Position.w * uSnap + 0.5) / uSnap * gl_Position.w;
`;
function psx(material, windAmount = 0) {
  const uWind = { value: windAmount };
  material.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = shared.uTime;
    shader.uniforms.uSnap = shared.uSnap;
    shader.uniforms.uWind = uWind;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\n' + PSX_GLSL)
      .replace('#include <project_vertex>', PSX_PROJECT_GLSL);
  };
  material.customProgramCacheKey = () => 'psx';
  return material;
}

// ------------------------------------------------------------ sky + ground
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(900, 24, 12),
  new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, depthWrite: false, fog: false })
);
sky.renderOrder = -1;
scene.add(sky);

{
  const R = 600, TEXEL = 0.1;                  // world size of one grass pixel
  grassTex.repeat.setScalar((R * 2) / (GRASS_SIZE * TEXEL));
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(R, 24),
    new THREE.MeshLambertMaterial({ map: grassTex })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);
}

// ------------------------------------------------------------------- tree
// A straight trunk forking into five rising limbs, a few levels of branches,
// and bunches of blossom on the outer ones.
const MAX_DEPTH = 5;
const MIN_R = 0.035;
const UP = new THREE.Vector3(0, 1, 0);
const segments = [];
const blobs = []; // { p: Vector3, s: radius }

function addSegment(a, b, ra, rb) {
  const d = new THREE.Vector3().subVectors(b, a);
  const len = d.length();
  const g = new THREE.CylinderGeometry(rb, ra, len, ra > 0.12 ? 6 : 4, 1, true);
  g.translate(0, len / 2, 0);
  g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(UP, d.normalize()));
  g.translate(a.x, a.y, a.z);
  segments.push(g);
}

function addBlob(p, size) {
  blobs.push({ p: p.clone().addScaledVector(randomUnit(), rr(0, 0.25)), s: size * rr(0.8, 1.2) });
}

function grow(start, dir, length, radius, depth) {
  const steps = depth === 0 ? 3 : 2;
  const endR = Math.max(radius * 0.75, MIN_R);
  const p = start.clone();
  const d = dir.clone();
  for (let i = 0; i < steps; i++) {
    d.addScaledVector(randomUnit(), depth === 0 ? 0.05 : 0.22); // gnarl
    if (depth >= 1 && depth <= 2) d.y += 0.08;                  // limbs reach upward
    if (depth === MAX_DEPTH) d.y -= 0.06;                       // tips arch over
    d.normalize();
    const q = p.clone().addScaledVector(d, length / steps);
    let ra = THREE.MathUtils.lerp(radius, endR, i / steps);
    const rb = THREE.MathUtils.lerp(radius, endR, (i + 1) / steps);
    if (depth === 0 && i === 0) ra *= 1.4;                      // root flare
    addSegment(p, q, ra, rb);
    p.copy(q);
    if (depth >= MAX_DEPTH - 2) addBlob(p, 0.42);
  }
  if (depth === MAX_DEPTH) { addBlob(p, 0.52); return; }

  const n = depth === 0 ? 5 : (rand() < 0.4 ? 3 : 2);
  const base = new THREE.Vector3().crossVectors(d, randomUnit()).normalize();
  for (let k = 0; k < n; k++) {
    const axis = base.clone().applyAxisAngle(d, (k / n) * Math.PI * 2 + rr(-0.45, 0.45));
    const cd = d.clone().applyAxisAngle(axis, depth === 0 ? rr(0.55, 0.95) : rr(0.35, 0.8));
    cd.y = Math.max(cd.y, depth < 3 ? 0.15 : -0.3);
    cd.normalize();
    const childLen = depth === 0 ? rr(1.7, 2.1) : length * rr(0.78, 0.9);
    grow(p, cd, childLen, Math.max(endR * rr(0.62, 0.75), MIN_R), depth + 1);
  }
}
grow(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0.05, 1, 0.02).normalize(), 2.6, 0.3, 0);

// measure the canopy so the camera and ground decorations fit any seed
const bounds = new THREE.Box3().setFromPoints(blobs.map((b) => b.p));
const treeTop = bounds.max.y + 0.8;
const canopyCentre = bounds.getCenter(new THREE.Vector3());
const centre = canopyCentre;
const treeRadius = 0.8 + blobs.reduce((m, b) => Math.max(m, Math.hypot(b.p.x - centre.x, b.p.z - centre.z)), 0);
const TARGET = new THREE.Vector3(centre.x, treeTop * 0.5, centre.z);

const bark = new THREE.Mesh(
  mergeGeometries(segments),
  psx(new THREE.MeshLambertMaterial({ color: PALETTE.bark, map: barkTex }), MOTION)
);
scene.add(bark);
segments.forEach((g) => g.dispose());

const dummy = new THREE.Object3D();
const tmpColor = new THREE.Color();
{
  // each bunch is three crossed squares carrying the cut-out blossom texture
  const card = new THREE.PlaneGeometry(1, 1);
  const bunch = mergeGeometries([card, card.clone().rotateY(Math.PI / 2), card.clone().rotateX(Math.PI / 2)]);
  const mesh = new THREE.InstancedMesh(
    bunch,
    psx(new THREE.MeshBasicMaterial({ map: blossomTex, alphaTest: 0.5, side: THREE.DoubleSide }), MOTION),
    blobs.length
  );
  const outward = new THREE.Vector3();
  blobs.forEach((b, i) => {
    dummy.position.copy(b.p);
    dummy.rotation.set(rr(0, 6.28), rr(0, 6.28), rr(0, 6.28));
    dummy.scale.setScalar(b.s * 2.6);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
    // shading is baked into colour: darker low in the canopy, brighter on the side facing the sun
    const height = (b.p.y - bounds.min.y) / (bounds.max.y - bounds.min.y);
    const sunny = Math.max(0, outward.subVectors(b.p, canopyCentre).normalize().dot(SUN_DIR));
    tmpColor.set(pick(PALETTE.blossoms)).multiplyScalar((0.74 + 0.16 * height + 0.14 * sunny) * rr(0.94, 1.04));
    mesh.setColorAt(i, tmpColor);
  });
  mesh.frustumCulled = false;
  scene.add(mesh);
}

// round blob shadow under the tree, and petals already on the grass
{
  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(treeRadius * 0.95, 14),
    new THREE.MeshBasicMaterial({ color: 0x0a3010, transparent: true, opacity: 0.38, depthWrite: false })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.set(centre.x, 0.03, centre.z);
  shadow.renderOrder = 1;
  scene.add(shadow);

  const N = 420;
  const fallen = new THREE.InstancedMesh(
    new THREE.PlaneGeometry(0.2, 0.16),
    new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }),
    N
  );
  for (let i = 0; i < N; i++) {
    const r = Math.pow(rand(), 0.7) * treeRadius * 1.3, a = rr(0, Math.PI * 2);
    dummy.position.set(centre.x + Math.cos(a) * r + WIND_DIR.x, 0.06, centre.z + Math.sin(a) * r + WIND_DIR.z);
    dummy.rotation.set(-Math.PI / 2, 0, rr(0, 6.28));
    dummy.scale.setScalar(rr(0.7, 1.3));
    dummy.updateMatrix();
    fallen.setMatrixAt(i, dummy.matrix);
    fallen.setColorAt(i, tmpColor.set(pick(PALETTE.blossoms)));
  }
  fallen.renderOrder = 2;
  scene.add(fallen);
}

// ---------------------------------------------------------- falling petals
const petalMesh = new THREE.InstancedMesh(
  new THREE.PlaneGeometry(0.2, 0.16),
  new THREE.MeshBasicMaterial({ color: PALETTE.petal, side: THREE.DoubleSide }),
  PETAL_COUNT
);
petalMesh.frustumCulled = false;
scene.add(petalMesh);

const R = (a, b) => a + (b - a) * Math.random();
const petals = Array.from({ length: PETAL_COUNT }, () => ({
  pos: new THREE.Vector3(), rot: new THREE.Euler(), spin: new THREE.Vector3(),
  vy: 0, phase: 0, delay: 0, rest: 0, landed: false,
}));
function respawn(p, first) {
  const b = blobs[(Math.random() * blobs.length) | 0];
  p.pos.set(b.p.x + R(-b.s, b.s), b.p.y - b.s * 0.5, b.p.z + R(-b.s, b.s));
  p.rot.set(R(0, 6.28), R(0, 6.28), R(0, 6.28));
  p.spin.set(R(-3, 3), R(-3, 3), R(-3, 3));
  p.vy = R(0.5, 1.0);
  p.phase = R(0, 6.28);
  p.delay = first ? R(0, 10) : R(0, 3);
  p.landed = false;
}
petals.forEach((p) => respawn(p, true));

function updatePetals(dt, t) {
  for (let i = 0; i < PETAL_COUNT; i++) {
    const p = petals[i];
    let visible = true;
    if (p.delay > 0) {
      p.delay -= dt; visible = false;
    } else if (p.landed) {
      p.rest -= dt;
      if (p.rest <= 0) { respawn(p, false); visible = false; }
    } else {
      const gust = 0.5 + 0.5 * Math.sin(t * 0.9 + p.pos.x * 0.35 + p.pos.z * 0.25);
      const drift = 0.12 + 0.4 * gust;
      p.pos.x += (WIND_DIR.x * drift + Math.sin(t * 2.1 + p.phase) * 0.3) * dt;
      p.pos.z += (WIND_DIR.z * drift + Math.cos(t * 1.7 + p.phase) * 0.3) * dt;
      p.pos.y -= p.vy * (0.75 + 0.25 * Math.sin(t * 3.0 + p.phase)) * dt;
      p.rot.x += p.spin.x * dt; p.rot.y += p.spin.y * dt; p.rot.z += p.spin.z * dt;
      if (p.pos.y <= 0.07) {
        p.pos.y = 0.07; p.landed = true; p.rest = R(4, 10);
        p.rot.set(-Math.PI / 2, 0, R(0, 6.28));
      }
    }
    dummy.position.copy(p.pos);
    dummy.rotation.copy(p.rot);
    dummy.scale.setScalar(visible ? 1 : 0);
    dummy.updateMatrix();
    petalMesh.setMatrixAt(i, dummy.matrix);
  }
  petalMesh.instanceMatrix.needsUpdate = true;
}
// run the petals forward a little so some are already in the air on load
for (let t = 0; t < 12; t += 0.05) updatePetals(0.05, t);

// -------------------------------------------------------------- lens flare
{
  const glow = canvasTexture(64, 64, (ctx) => {
    const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(255,250,220,0.7)'); g.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
  }, { pixelated: false });
  const hexagon = canvasTexture(64, 64, (ctx) => {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) ctx.lineTo(32 + 29 * Math.cos((i * Math.PI) / 3), 32 + 29 * Math.sin((i * Math.PI) / 3));
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
  }, { pixelated: false });
  const flare = new Lensflare();
  flare.position.copy(SUN_DIR).multiplyScalar(800);
  flare.addElement(new LensflareElement(glow, 80, 0, new THREE.Color(0xffffff)));
  flare.addElement(new LensflareElement(hexagon, 26, 0.3, new THREE.Color(0x9a8cff)));
  flare.addElement(new LensflareElement(hexagon, 46, 0.5, new THREE.Color(0x7f9dff)));
  flare.addElement(new LensflareElement(hexagon, 34, 0.75, new THREE.Color(0x8fe0b0)));
  flare.addElement(new LensflareElement(hexagon, 22, 1.0, new THREE.Color(0xb0c8ff)));
  scene.add(flare);
}

// ------------------------------------------------------ camera + controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 4;
controls.maxDistance = 24;
controls.minPolarAngle = 0.5;
controls.maxPolarAngle = 1.72;                 // a little below level, never under the grass
controls.autoRotate = false;
controls.autoRotateSpeed = 0.7;

// the camera stays put until it has been left alone for a while, then orbits
// until the next drag or zoom
let idleTimer = 0;
function waitForIdle() {
  clearTimeout(idleTimer);
  if (!reducedMotion) idleTimer = setTimeout(() => { controls.autoRotate = true; }, IDLE_SECONDS * 1000);
}
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(idleTimer); });
controls.addEventListener('end', waitForIdle);
waitForIdle();

// ------------------------------------------------- low-res target + screen
// The scene is drawn into a small image, then one full-window pass puts it on
// screen: either stretched smoothly, which is the soft picture a PS2 gave over a
// good cable, or through the CRT filter.
const sceneRT = new THREE.WebGLRenderTarget(1, 1, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
});
const screenMaterial = new THREE.ShaderMaterial({
  uniforms: {
    tScene: { value: sceneRT.texture },
    uRes: { value: new THREE.Vector2(1, 1) },   // size of the small image
    uCrt: { value: 1 },
    tBloom: { value: null },                    // the blurred glow, see bloom below
    uBloom: { value: 0 },                       // how much of it to add; 0 = off
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D tScene;
    uniform vec2 uRes;
    uniform float uCrt;
    uniform sampler2D tBloom;
    uniform float uBloom;
    varying vec2 vUv;

    // the small image with its glow added
    vec3 picture(vec2 uv) { return texture2D(tScene, uv).rgb + uBloom * texture2D(tBloom, uv).rgb; }

    // bulge the picture like curved glass
    vec2 curve(vec2 uv) {
      uv = uv * 2.0 - 1.0;
      vec2 off = abs(uv.yx) / vec2(5.5, 4.5);
      uv += uv * off * off;
      uv /= 1.0 + 1.0 / (vec2(5.5, 4.5) * vec2(5.5, 4.5)); // zoom in so the bulged picture still fills the window
      return uv * 0.5 + 0.5;
    }
    // one scanline of the small image, smeared sideways as a tube would
    vec3 row(vec2 px) {
      float x = px.x - 0.5, y = floor(px.y) + 0.5;
      vec3 a = picture(vec2(floor(x) + 0.5, y) / uRes);
      vec3 b = picture(vec2(floor(x) + 1.5, y) / uRes);
      return mix(a, b, fract(x));
    }
    void main() {
      vec3 col;
      if (uCrt < 0.5) {
        col = picture(vUv);                              // stretched smoothly over the window
      } else {
        vec2 uv = curve(vUv);
        vec2 px = uv * uRes;
        // colour fringing: red and blue land slightly apart
        col = vec3(row(px + vec2(0.45, 0.0)).r, row(px).g, row(px - vec2(0.45, 0.0)).b);
        // scanlines: bright in the middle of each row, dark between rows. With 448
        // rows a row is only two or three screen pixels tall in most windows, too
        // few to draw a dark gap without moire, so the lines fade out to their
        // average brightness as the rows get that thin
        float rowPx = 1.0 / fwidth(px.y);
        float scan = mix(0.55, 1.18, pow(sin(fract(px.y) * 3.14159), 1.4));
        col *= mix(0.95, scan, smoothstep(2.0, 4.0, rowPx));
        // phosphor stripes
        float stripe = mod(floor(gl_FragCoord.x), 3.0);
        col *= vec3(stripe == 0.0 ? 1.1 : 0.94, stripe == 1.0 ? 1.1 : 0.94, stripe == 2.0 ? 1.1 : 0.94);
        // gently darker corners
        float v = uv.x * (1.0 - uv.x) * uv.y * (1.0 - uv.y) * 16.0;
        col *= mix(0.74, 1.08, pow(clamp(v, 0.0, 1.0), 0.3));
      }
      gl_FragColor = vec4(col, 1.0);
      #include <colorspace_fragment>
    }
  `,
  depthTest: false, depthWrite: false,
});
const screenScene = new THREE.Scene();
const screenQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), screenMaterial);
screenQuad.frustumCulled = false;
screenScene.add(screenQuad);
const screenCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// ------------------------------------------------------------------- bloom
// Bright parts of the picture glow, as in PS2 games that drew the frame over itself
// blurred: whatever in the small image is brighter than BLOOM_THRESHOLD is copied
// to a quarter-size image, blurred across and then down, and the screen pass adds
// the result on top. Toggle: the button, the G key, or ?bloom=off in the URL; the
// choice is remembered.
const BLOOM_SCALE = 4, BLOOM_THRESHOLD = 0.68, BLOOM_STRENGTH = 0.4;
const bloomRT = [0, 1].map(() => new THREE.WebGLRenderTarget(1, 1, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false,
}));
screenMaterial.uniforms.tBloom.value = bloomRT[1].texture;
const bloomMaterial = new THREE.ShaderMaterial({
  uniforms: {
    tMap: { value: null },
    uStep: { value: new THREE.Vector2() },      // from one blur tap to the next
    uSpread: { value: new THREE.Vector2() },    // each tap is two samples this far either side, to take in every row when shrinking
    uThreshold: { value: 0 },                   // 0 = keep everything (the second pass)
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D tMap;
    uniform vec2 uStep, uSpread;
    uniform float uThreshold;
    varying vec2 vUv;
    vec3 tap(float i) {
      vec2 at = vUv + uStep * i;
      vec3 c = 0.5 * (texture2D(tMap, at + uSpread).rgb + texture2D(tMap, at - uSpread).rgb);
      float bright = dot(c, vec3(0.299, 0.587, 0.114));   // by eye, so the deep blue sky stays calm
      return uThreshold > 0.0 ? c * smoothstep(uThreshold, uThreshold + 0.3, bright) : c;
    }
    void main() {
      vec3 sum = tap(0.0) * 0.204;
      sum += (tap(1.0) + tap(-1.0)) * 0.180;
      sum += (tap(2.0) + tap(-2.0)) * 0.124;
      sum += (tap(3.0) + tap(-3.0)) * 0.066;
      sum += (tap(4.0) + tap(-4.0)) * 0.028;
      gl_FragColor = vec4(sum, 1.0);
    }
  `,
  depthTest: false, depthWrite: false,
});
const bloomScene = new THREE.Scene();
const bloomQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bloomMaterial);
bloomQuad.frustumCulled = false;
bloomScene.add(bloomQuad);
// call once the scene has been drawn into sceneRT
function renderBloom() {
  if (!bloomIsOn()) return;
  const u = bloomMaterial.uniforms, { width, height } = bloomRT[0];
  u.tMap.value = sceneRT.texture;
  u.uStep.value.set(1 / width, 0); u.uSpread.value.set(0, 0.25 / height); u.uThreshold.value = BLOOM_THRESHOLD;
  renderer.setRenderTarget(bloomRT[0]);
  renderer.render(bloomScene, screenCamera);
  u.tMap.value = bloomRT[0].texture;
  u.uStep.value.set(0, 1 / height); u.uSpread.value.set(0, 0); u.uThreshold.value = 0;
  renderer.setRenderTarget(bloomRT[1]);
  renderer.render(bloomScene, screenCamera);
}
const bloomButton = document.getElementById('bloom');
function setBloom(on) {
  screenMaterial.uniforms.uBloom.value = on ? BLOOM_STRENGTH : 0;
  bloomButton.textContent = on ? 'BLOOM: on' : 'BLOOM: off';
  bloomButton.setAttribute('aria-pressed', String(on));
  try { localStorage.setItem('cherry-bloom', on ? 'on' : 'off'); } catch {}
}
const bloomIsOn = () => screenMaterial.uniforms.uBloom.value > 0;
{
  let saved = null;
  try { saved = localStorage.getItem('cherry-bloom'); } catch {}
  setBloom((new URLSearchParams(location.search).get('bloom') || saved) !== 'off');
}
bloomButton.addEventListener('click', () => setBloom(!bloomIsOn()));

// CRT toggle: the button, the C key, or ?crt=off in the URL; the choice is remembered
const crtButton = document.getElementById('crt');
function setCrt(on) {
  screenMaterial.uniforms.uCrt.value = on ? 1 : 0;
  crtButton.textContent = on ? 'CRT: on' : 'CRT: off';
  crtButton.setAttribute('aria-pressed', String(on));
  try { localStorage.setItem('cherry-crt', on ? 'on' : 'off'); } catch {}
}
{
  let saved = null;
  try { saved = localStorage.getItem('cherry-crt'); } catch {}
  setCrt((new URLSearchParams(location.search).get('crt') || saved) !== 'off');
}
const crtIsOn = () => screenMaterial.uniforms.uCrt.value > 0.5;
crtButton.addEventListener('click', () => setCrt(!crtIsOn()));
addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key.toLowerCase() === 'c') setCrt(!crtIsOn());
  if (e.key.toLowerCase() === 'g') setBloom(!bloomIsOn());
});

function resize() {
  const aspect = innerWidth / innerHeight;
  // RENDER_WIDTH columns span a 4:3 picture; a window of another shape keeps
  // the same pixel width and simply shows more or fewer of them
  const h = RENDER_HEIGHT, w = Math.round(RENDER_WIDTH * aspect / (4 / 3));
  sceneRT.setSize(w, h);
  for (const rt of bloomRT) rt.setSize(Math.ceil(w / BLOOM_SCALE), Math.ceil(h / BLOOM_SCALE));
  screenMaterial.uniforms.uRes.value.set(w, h);
  shared.uSnap.value.set(w / 2 * SUBPIXEL, h / 2 * SUBPIXEL);
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
}
resize();
addEventListener('resize', resize);

{
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const fit = Math.max((treeTop / 2) / tanV, treeRadius / (tanV * camera.aspect));
  const dist = Math.min(fit * 1.05 + treeRadius * 0.4, controls.maxDistance);
  camera.position.set(TARGET.x, TARGET.y - 1.2, TARGET.z + dist);
  controls.update();
}

setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 5000);

// ------------------------------------------------------------------- loop
const clock = new THREE.Clock();
let time = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05) * MOTION;
  time += dt;
  shared.uTime.value = time;
  updatePetals(dt, time);
  controls.update();
  sky.position.copy(camera.position);
  renderer.setRenderTarget(sceneRT);
  renderer.render(scene, camera);
  renderBloom();
  renderer.setRenderTarget(null);
  renderer.render(screenScene, screenCamera);
});
</script>
</body>
